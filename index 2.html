<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Chatterbox</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet"><meta name="theme-color" content="#0c0d17">
<style>
:root{--bg:#0f1020;--card:#1a1b30;--line:#2a2c47;--tx:#eef0ff;--mute:#9aa0c8;--ac:#7c5cff;--bad:#fb7185;--ok:#34d399;color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%;margin:0}#app{height:100%}
body{background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:env(safe-area-inset-top) 0 0}
button,input,textarea,select{font:inherit;color:inherit}
input,textarea,select{width:100%;background:#12132a;border:1px solid var(--line);border-radius:12px;padding:12px;margin:4px 0 10px}
button{background:var(--ac);border:0;border-radius:12px;padding:10px 14px;cursor:pointer;min-height:44px}
button.g{background:var(--card);border:1px solid var(--line)}button.d{background:transparent;color:var(--bad);border:1px solid var(--line)}
button:disabled{opacity:.5}h1,h2,h3{margin:0 0 8px}small,.m{color:var(--mute)}
.shell{display:flex;flex-direction:column;height:100%}#main{flex:1;min-height:0;overflow:auto}
.nav{display:flex;border-top:1px solid var(--line);background:var(--card);padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;background:none;border-radius:0;color:var(--mute)}.nav button.on{color:var(--tx);box-shadow:inset 0 2px var(--ac)}
.pg{padding:16px;max-width:640px;margin:0 auto}.auth{max-width:380px;margin:8vh auto;padding:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:0 0 12px}
.row{display:flex;align-items:center;gap:10px;padding:8px 0}.row>.g1{flex:1;min-width:0}.row .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row button{min-height:36px;padding:6px 10px}.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;flex:none}
.split{display:flex;height:100%}.cl{width:100%;overflow:auto;padding:12px}.th{display:none;flex-direction:column;width:100%;min-width:0}
.split.open .cl{display:none}.split.open .th{display:flex}
@media(min-width:768px){.cl{width:320px;border-right:1px solid var(--line)}.th{display:flex}.split.open .cl{display:block}.bk{display:none}}
.ci{display:flex;gap:10px;padding:10px;border-radius:12px;cursor:pointer;align-items:center}.ci:hover,.ci.on{background:var(--card)}
.hd{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
#ml{flex:1;overflow:auto;padding:12px 14px}.msg{display:flex;flex-direction:column;margin:6px 0;align-items:flex-start}.msg.me{align-items:flex-end}
.bub{background:var(--card);border-radius:14px;padding:8px 12px;max-width:85%;white-space:pre-wrap;word-break:break-word}.me .bub{background:var(--ac)}
.cmp{display:flex;gap:8px;padding:10px 14px calc(10px + env(safe-area-inset-bottom)*0);border-top:1px solid var(--line)}.cmp input{margin:0}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--ac)}.act{cursor:pointer;text-decoration:underline}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#000c;padding:10px 14px;border-radius:12px;z-index:9;max-width:90%}
.empty{text-align:center;color:var(--mute);padding:30px 10px}
html[data-theme=light]{--bg:#f6f7ff;--card:#fff;--line:#d9dcf2;--tx:#14162b;--mute:#5b6190;color-scheme:light}
html[data-theme=light] input,html[data-theme=light] textarea,html[data-theme=light] select{background:#fff}
body{font-size:calc(16px*var(--fs,1))}.me .bub{color:#fff}
.sp-compact .msg{margin:2px 0}.sp-roomy .msg{margin:14px 0}.sp-roomy .bub{padding:12px 16px}
.bg-mid #ml{background:color-mix(in srgb,var(--tx) 6%,var(--bg))}.bg-tint #ml{background:color-mix(in srgb,var(--ac) 12%,var(--bg))}
.rm *,.rm *:before,.rm *:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
html.hc{--line:#fff;--mute:#e6e8ff}html.hc[data-theme=light]{--line:#000;--mute:#222}.hc .bub{outline:1px solid currentColor}
.srow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.srow:last-child{border:0}.srow .g1{flex:1;min-width:0}
.sw{position:relative;width:46px;height:28px;flex:none}.sw input{position:absolute;inset:0;opacity:0;margin:0;padding:0;border:0;width:100%;height:100%;cursor:pointer;z-index:1}
.sw i{position:absolute;inset:0;background:var(--line);border-radius:99px;transition:.2s}.sw i:after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked+i{background:var(--ac)}.sw input:checked+i:after{transform:translateX(18px)}.sw input:focus-visible+i{outline:2px solid var(--tx);outline-offset:2px}
.sws{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.swt{width:30px;height:30px;min-height:30px;padding:0;border-radius:50%;border:2px solid transparent}.swt.on{border-color:var(--tx)}
.cmp textarea{margin:0;resize:none}.sf label{display:block;margin-top:6px}

.av{overflow:hidden}.pvl{cursor:pointer}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.pban{aspect-ratio:3/1;background:linear-gradient(135deg,var(--pa),color-mix(in srgb,var(--pa) 35%,#000));overflow:hidden;position:relative}
.pavw{position:relative;width:96px;height:96px;margin:-48px 0 0 16px}
.pav{width:96px;height:96px;border-radius:50%;border:4px solid var(--card);overflow:hidden;display:grid;place-items:center;font-size:36px;font-weight:700;color:#fff;box-sizing:border-box}
.sdot{position:absolute;right:4px;bottom:4px;width:22px;height:22px;border-radius:50%;border:4px solid var(--card);box-sizing:border-box}
.pbody{padding:6px 16px 16px}.pn{margin:6px 0 0;font-size:22px;overflow-wrap:anywhere}.pu{color:var(--mute)}.pcs{margin-top:8px}
.pbx{margin-top:12px;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--pa) 10%,var(--bg))}.pbx b{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute)}.pbx p{margin:4px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}.pbx a{display:block;margin-top:6px;color:var(--pa);overflow-wrap:anywhere}
.pmeta{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;color:var(--mute);font-size:13px}
#pov{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto}.pvtop{padding:10px 12px;position:sticky;top:0;background:var(--bg);z-index:1}
.pact{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.pact>*{flex:1 1 120px}
#ped{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column}
.edh{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--line)}
.edm{flex:1;overflow:auto;display:flex;flex-direction:column;gap:12px;padding:12px}
.edt{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}.edt button{flex:none;padding:8px 14px;border-radius:99px;background:var(--card);font-size:14px;font-weight:600}.edt button.on{background:var(--ac);color:#fff}
.edb{padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--bg)}.edbb{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.cvp{position:relative;overflow:hidden;touch-action:none;cursor:grab;background:var(--bg);border:2px dashed var(--line);display:grid;place-items:center;color:var(--mute);margin:0 auto;user-select:none;-webkit-user-select:none}
.cvp.round{width:min(240px,70vw);aspect-ratio:1;border-radius:50%}.cvp.wide{width:100%;aspect-ratio:3/1;border-radius:14px}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--ac);width:0}
.edr{display:flex;gap:8px;margin-bottom:8px}.edr input{margin:0;min-width:0}.edr button{flex:none;width:44px}
@media(min-width:900px){.edm{flex-direction:row;align-items:flex-start}.edp{width:380px;position:sticky;top:0;flex:none}.edf{flex:1;min-width:0;max-width:640px}}
#mnu{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center}.mbk{position:absolute;inset:0;background:#0009}.mbx{position:relative;background:var(--card);border-radius:18px 18px 0 0;padding:12px 12px calc(12px + env(safe-area-inset-bottom));width:100%;max-width:520px;display:flex;flex-direction:column;gap:6px;max-height:80%;overflow:auto}.mer{display:flex;gap:6px}.mer button{font-size:22px;padding:6px 4px;flex:1}.bub{cursor:pointer}.rq{border-left:3px solid var(--ac);padding:2px 8px;margin-bottom:4px;font-size:13px;opacity:.85;cursor:pointer;white-space:normal}.rxs{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}.rx{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:2px 8px;font-size:13px;cursor:pointer}.rx.on{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 25%,var(--card))}.rpb,.pnb{display:flex;gap:8px;padding:8px 14px;background:var(--card);font-size:13px;border-top:1px solid var(--line)}.pnb{border-top:0;border-bottom:1px solid var(--line);cursor:pointer}.msg.hl .bub{outline:2px solid var(--ac)}
.rail{display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px 0;width:72px;flex:none;background:color-mix(in srgb,var(--bg) 65%,#000);overflow:auto}.rb{width:48px;height:48px;min-height:0;padding:0;border-radius:50%;font-size:22px;background:var(--card);flex:none}.rb.on{background:var(--ac);border-radius:16px}.rsep{width:32px;height:2px;background:var(--line);flex:none}.split.open .rail{display:none}.cl{min-width:0;flex:1}.mh{font-size:28px;margin:6px 0 12px}.tb{display:flex;gap:8px;margin-bottom:10px}.tb button{min-height:40px;border-radius:14px;padding:6px 12px}.tb button.on{outline:2px solid var(--ac)}.ci{padding:12px 10px}.ci .av{width:48px;height:48px}.ci b{font-size:17px}
@media(min-width:768px){.split.open .rail{display:flex}.cl{flex:none}}
.pill{display:flex;align-items:center;gap:2px;flex:1;min-width:0;background:color-mix(in srgb,var(--card) 90%,#fff 4%);border:1px solid var(--line);border-radius:28px;padding:4px 6px}.pill input,.pill textarea{border:0;background:transparent;margin:0;padding:10px 8px;flex:1;min-width:0;outline:0;resize:none}.ib{background:none;min-height:40px;width:40px;padding:0;border-radius:50%;font-size:22px;color:var(--mute);flex:none}.ib.snd{background:var(--ac);color:#fff;font-size:18px}.ib[hidden],#emp[hidden]{display:none}.atc{display:flex;flex-direction:column;gap:6px;margin-top:4px;max-width:85%}.msg.me .atc{align-items:flex-end}.atc img,.atc video{max-width:100%;max-height:320px;border-radius:12px}.atc img{cursor:pointer}.atc audio{width:250px;max-width:100%}.fl{display:flex;gap:6px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;color:var(--tx);text-decoration:none;overflow-wrap:anywhere}#emp{background:var(--card);border-top:1px solid var(--line);padding:6px 10px}.emt{display:flex;gap:4px;overflow:auto}.emt button{min-height:36px;width:40px;padding:0;background:none;font-size:20px;flex:none}.emt button.on{background:var(--bg)}.emg{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;max-height:150px;overflow:auto;margin-top:4px}.emg button{background:none;padding:2px;min-height:40px;font-size:24px}.iv{align-items:center;justify-content:center;flex-direction:column;gap:12px}.ivb{position:relative;display:flex;gap:8px}.ivb a{background:var(--ac);color:#fff;border-radius:12px;padding:12px 14px;text-decoration:none}
.sn{font-size:12px;color:var(--mute);margin-top:2px;cursor:pointer}
#ml{padding:8px 14px}.msg{flex-direction:row;align-items:flex-start;gap:10px;margin:0;padding:1px 0}.msg.f{margin-top:14px}.mav{width:40px;flex:none}.mc{min-width:0;flex:1}.mn b{font-size:16px}.mn small{margin-left:4px}.bub{background:none!important;padding:0;border-radius:0;max-width:100%}.atc{max-width:100%}
#inf{position:fixed;inset:0;z-index:45;background:var(--bg);overflow:auto;padding-top:env(safe-area-inset-top)}.ihd{padding:10px 12px}.ipf{display:flex;gap:12px;align-items:center;padding:4px 16px 12px}.ipf .av{width:64px;height:64px;font-size:28px}.itb{display:flex;gap:4px;overflow:auto;padding:0 12px;border-bottom:1px solid var(--line)}.itb button{background:none;border-radius:0;color:var(--mute);flex:none}.itb button.on{color:var(--ac);box-shadow:inset 0 -2px var(--ac)}.ibd{padding:14px 16px;max-width:640px;margin:0 auto}.mg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.mg img,.mg video{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px}
.bdg{font-size:11px;background:var(--ac);color:#fff;border-radius:99px;padding:1px 7px;margin-left:4px}
/* ---------- UI refresh ---------- */
:root{--bg:#0c0d17;--card:#171826;--line:#25273b;--mute:#8b90b4;--r:20px;--g2:color-mix(in srgb,var(--ac) 55%,#ff7ab8)}
html[data-theme=light]{--bg:#f3f4fb;--card:#fff;--line:#e2e4f1;--mute:#6a6f96}
*{scrollbar-width:thin;scrollbar-color:var(--line) transparent}
body{font-family:Figtree,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:radial-gradient(900px 520px at 85% -10%,color-mix(in srgb,var(--ac) 14%,transparent),transparent) fixed,var(--bg)}
h1,h2,h3,.mh,.pn{font-family:'Bricolage Grotesque',Figtree,system-ui,sans-serif;letter-spacing:-.02em}
svg.ic{display:block;flex:none}
button{font-weight:600;transition:transform .12s,background .15s,color .15s}button:active{transform:scale(.97)}
button:focus-visible,[role=button]:focus-visible,.ci:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
input,textarea,select{border-radius:14px;background:color-mix(in srgb,var(--card) 70%,var(--bg));transition:border-color .15s,box-shadow .15s}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 25%,transparent)}
.card,.pcard{border-radius:var(--r)}
.empty{padding:48px 20px;font-size:15px}
#toast{background:var(--card);border:1px solid var(--line);box-shadow:0 12px 32px #0006;border-radius:16px;bottom:96px;font-weight:600}
.mbx{border-radius:26px 26px 0 0}.mbk{backdrop-filter:blur(3px)}
/* auth */
.auth{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:28px 24px;box-shadow:0 24px 60px -24px #000a}
.auth h1{font-size:30px;display:flex;align-items:center;gap:12px;margin-bottom:4px}
.logo,.av.gr{background:linear-gradient(140deg,var(--ac),var(--g2));color:#fff}
.logo{width:44px;height:44px;border-radius:14px;display:grid;place-items:center}
.auth label{font-size:13px;font-weight:600;color:var(--mute)}
/* nav */
.nav{gap:4px;padding:6px 10px calc(6px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.nav button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:54px;padding:6px 0;border-radius:18px;font-size:12px;box-shadow:none!important}
.nav button.on{color:var(--ac);background:color-mix(in srgb,var(--ac) 14%,transparent)}
.nb:empty{display:none}.nb{position:absolute;top:5px;left:calc(50% + 6px);font-size:11px;line-height:1;color:#fff;background:var(--bad);border-radius:99px;padding:3px 6px}
.nb:has(.dot){background:none;padding:0;top:8px;left:calc(50% + 9px)}.nb .dot{background:var(--bad);box-shadow:0 0 0 2px var(--bg)}
/* rail */
.rail{width:76px;background:color-mix(in srgb,var(--bg) 70%,#000)}
.rb{width:50px;height:50px;display:grid;place-items:center;border-radius:18px;color:var(--mute)}
.rb.on{background:var(--ac);color:#fff}
/* chat list */
.cl{padding:14px 12px}
.mh{font-size:34px;font-weight:800;margin:6px 6px 14px}
.tb{flex-wrap:wrap;margin:0 4px 12px}
.tb button{display:flex;align-items:center;gap:7px;min-height:42px;padding:0 15px;border-radius:99px;font-size:14px}
.tb button.on{outline:0;background:color-mix(in srgb,var(--ac) 18%,var(--card));color:var(--ac)}
.ci{gap:14px;padding:11px 12px;margin:2px 0;border-radius:18px;transition:background .15s}
.ci:hover{background:color-mix(in srgb,var(--card) 70%,transparent)}
.ci.on{background:var(--card);box-shadow:inset 3px 0 var(--ac)}
.ci .av{width:52px;height:52px;font-size:20px}
.ci b{font-size:16px;font-weight:700}.ci small{font-size:14px}
.ci:not([data-id]) b{font-weight:600}
.ci>small{align-self:flex-start;margin-top:4px;font-size:12px}
.ci.un .m small{color:var(--tx);font-weight:600}.ci.un>small{color:var(--ac);font-weight:700}
.dot{width:10px;height:10px;margin-left:6px;box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 25%,transparent)}
.av.q{background:color-mix(in srgb,var(--ac) 14%,var(--card));color:var(--ac)}
/* thread */
.hd{gap:6px;padding:10px 12px;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.hd .bk{width:40px;min-height:40px;padding:0;display:grid;place-items:center;border:0;border-radius:50%;background:none}
.hd .av{width:42px;height:42px}.hd b{font-size:16px}
#ml{padding:10px 14px 16px}
.msg{padding:1px 0}.msg.f{margin-top:12px}
.mav,.mav .av{width:36px}.mav .av{height:36px;font-size:15px}
.mc{flex:none;max-width:80%}
.mn{margin:0 4px 3px}.mn b{font-size:13px;font-weight:700}.mn small{font-size:11px}
.bub{background:var(--card)!important;padding:9px 14px;border-radius:20px 20px 20px 6px;width:fit-content;max-width:100%;line-height:1.38}
.msg.me{justify-content:flex-end}.msg.me .mav,.msg.me .mn b{display:none}
.msg.me .mc{display:flex;flex-direction:column;align-items:flex-end}
.me .bub{background:var(--ac)!important;color:#fff;border-radius:20px 20px 6px 20px}.me .bub .rq{border-color:#fff9}
.atc img,.atc video,.fl{border-radius:16px}
.rpb,.pnb{background:color-mix(in srgb,var(--card) 80%,transparent)}
/* composer */
.cmp{padding:8px 12px calc(10px + env(safe-area-inset-bottom));border-top:0}
.pill{padding:4px 5px;border-radius:99px;background:var(--card)}
.pill:focus-within{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 20%,transparent)}
.pill input,.pill textarea{padding:11px 8px;box-shadow:none!important}
.ib{display:grid;place-items:center;width:42px;min-height:42px}.ib:hover{color:var(--tx)}.ib.snd{background:var(--ac);color:#fff}

/* icon-only nav */
.nav{padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
.nav button{min-height:56px;border-radius:0;background:none!important;color:color-mix(in srgb,var(--tx) 45%,var(--bg))}
.nav button.on{color:var(--tx)}.nav button.on svg{stroke-width:2.2}
.nav-av{position:relative;display:block;width:34px;height:34px;border-radius:50%;opacity:.75}
.nav button.on .nav-av{opacity:1;box-shadow:0 0 0 2px var(--ac)}
.nav-av .av{width:34px;height:34px;font-size:15px}
.sd{position:absolute;right:-5px;top:-5px;width:15px;height:15px;border-radius:50%;border:3px solid var(--bg);background:#34d399}
.sd.s-idle{background:#f5b84b}.sd.s-dnd{background:var(--bad)}.sd.s-invisible{background:#8b90b4}

/* servers (stage 1) */
.rb.sv{overflow:hidden;font-weight:700;color:var(--tx);background:var(--card)}.rb.sv img{width:100%;height:100%;object-fit:cover}
#toast{z-index:300}
#smod{position:fixed;inset:0;z-index:200;background:#000a;display:grid;place-items:center;padding:16px;overflow:auto}
.sm-w{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;width:100%;max-width:440px;max-height:92%;overflow:auto}
.sm-w .err,.err{color:var(--bad)}.sm-w .pact{margin-top:12px}
#sv{position:fixed;inset:0;z-index:100;background:var(--bg);padding-top:env(safe-area-inset-top)}
.svl{display:grid;height:100%;grid-template-columns:260px 1fr 230px;padding-bottom:env(safe-area-inset-bottom)}
.svs,.svr{background:var(--card);overflow:auto;min-height:0;border-right:1px solid var(--line)}.svr{border:0;border-left:1px solid var(--line);padding:10px}

#adm .tg{font-size:11px;padding:2px 7px;border-radius:99px;border:1px solid var(--line);color:var(--mute);margin-left:4px;white-space:nowrap}
#adm .tg.b{color:var(--bad);border-color:var(--bad)}#adm .tg.o{color:var(--ok);border-color:var(--ok)}#adm .tg.t{color:#fbbf24;border-color:#fbbf24}
#adm .ur{cursor:pointer;border-bottom:1px solid var(--line)}#adm .tabs{display:flex;gap:6px;margin-bottom:10px}#adm .tabs button{flex:1}
#adm .err{color:var(--bad)}#adm textarea{min-height:70px}#bangate{position:fixed;inset:0;z-index:99999;background:var(--bg);display:grid;place-items:center;padding:20px;text-align:center}
#bangate .card{max-width:420px}
</style>
<script>
(()=>{
const rpc=async(n,a)=>{const{data,error}=await sb.rpc(n,a||{});if(error)throw error;return data};
const fd=d=>d?new Date(d).toLocaleString([],{dateStyle:'medium',timeStyle:'short'}):'—';
const K={ban:'🔨 Ban',unban:'✅ Unban',timeout:'⏳ Timeout',untimeout:'▶️ Timeout lifted',warn:'⚠️ Warning'};
const DUR={'1h':36e5,'1d':864e5,'3d':2592e5,'7d':6048e5};
let role=null,uid=null,pres={},A=null,pch=null,mch=null,tmr=null,seenTO=null,lt=null;
const can=k=>role==='admin'||(role==='moderator'&&['warn','timeout','untimeout'].includes(k));
const msg=e=>({NOT_AUTHORIZED:'You are not allowed to do that.',TARGET_IS_STAFF:'Staff accounts cannot be moderated here.',INVALID_TARGET:'Invalid user.',EXPIRY_IN_PAST:'The expiry must be in the future.',EXPIRY_REQUIRED:'Choose how long the timeout lasts.'}[(e&&e.message)||'']||(e&&e.message)||'Something went wrong.');

/* ---------- ban gate (UX only; the database enforces the ban) ---------- */
async function check(){
 if(!S.me)return;
 try{const m=await rpc('my_moderation');let g=document.getElementById('bangate');
  if(m.banned){if(!g){g=document.createElement('div');g.id='bangate';g.setAttribute('role','alertdialog');document.body.appendChild(g);document.body.style.overflow='hidden'}
   g.innerHTML=`<div class="card"><h2>🚫 Your account has been banned</h2><p>${m.ban_reason?'Reason: '+esc(m.ban_reason):'No reason was given.'}</p><p class="m">${m.ban_expires_at?'Temporary ban. Access returns '+esc(fd(m.ban_expires_at))+'.':'This ban is permanent.'}</p><button id="bgo" style="width:100%">Log out</button></div>`;
   g.querySelector('#bgo').onclick=()=>sb.auth.signOut()}
  else if(g){g.remove();document.body.style.overflow=''}
  const k=m.timed_out?m.timeout_expires_at:null;if(k&&k!==seenTO)toast('You are timed out until '+fd(k)+'. You can’t send messages or start calls (a timeout is not a ban).');seenTO=k;
  clearTimeout(lt);const nx=[m.banned&&m.ban_expires_at,m.timed_out&&m.timeout_expires_at].filter(Boolean).map(x=>new Date(x)-Date.now());
  if(nx.length)lt=setTimeout(check,Math.min(Math.max(Math.min(...nx)+1500,2000),2147e6))
 }catch(e){console.error(e)}}

/* ---------- boot / realtime ---------- */
async function boot(){
 if(!S.me||uid===S.me.id)return;uid=S.me.id;check();loadSrv();
 try{role=await rpc('my_staff_role')}catch(e){role=null}
 if(mch)sb.removeChannel(mch);
 mch=sb.channel('cb-mod').on('postgres_changes',{event:'*',schema:'public',table:'moderation_state'},p=>{const r=p.new||{};if(r.user_id===uid)check();else if(role&&A)reload()});
 if(role)mch.on('postgres_changes',{event:'INSERT',schema:'public',table:'mod_actions'},()=>A&&reload());
 mch.subscribe();
 if(pch)sb.removeChannel(pch);
 pch=sb.channel('cb-presence',{config:{presence:{key:uid}}}).on('presence',{event:'sync'},()=>{pres=pch.presenceState();A&&A.view==='list'&&paintList()});
 pch.subscribe(s=>{if(s==='SUBSCRIBED'&&S.me.status!=='invisible')pch.track({at:Date.now()})});
 clearInterval(tmr);tmr=setInterval(check,60000);render()}
function teardown(){uid=null;role=null;pres={};seenTO=null;closeAdm();clearInterval(tmr);[mch,pch].forEach(c=>c&&sb.removeChannel(c));mch=pch=null;const g=document.getElementById('bangate');if(g)g.remove();document.body.style.overflow=''}
sb.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT')teardown()});
const oe=window.enter;window.enter=async function(...a){const r=await oe.apply(this,a);boot();return r};
const orr=window.render;window.render=function(...a){const r=orr.apply(this,a);try{if(role&&S.me){const n=document.querySelector('.nav');if(n&&!n.querySelector('[data-adm]')){const b=document.createElement('button');b.dataset.adm='1';b.title=b.ariaLabel='Admin Panel';b.innerHTML=I('shield',26);n.appendChild(b)}}}catch(e){}return r};

/* ---------- admin panel (every action is re-authorized by the database) ---------- */
function openAdm(){if(!role||A)return;A={view:'list',tab:'users',q:'',f:'all',users:null,stats:null,logs:[],sel:null,form:null,err:'',busy:false};
 const o=document.createElement('div');o.id='adm';o.setAttribute('role','dialog');o.setAttribute('aria-label','Admin Panel');document.body.appendChild(o);document.body.style.overflow='hidden';paint();reload()}
function closeAdm(){const o=document.getElementById('adm');if(o)o.remove();A=null;if(!document.getElementById('bangate'))document.body.style.overflow=''}
async function reload(){if(!A)return;A.err='';
 try{const[u,s,l]=await Promise.all([rpc('mod_list_users',{p_q:A.q,p_filter:A.f,p_limit:100}),rpc('mod_stats'),sb.from('mod_actions').select('*').order('created_at',{ascending:false}).limit(100)]);
  if(l.error)throw l.error;if(!A)return;A.users=u;A.stats=s;A.logs=l.data;await prof(l.data.flatMap(x=>[x.actor_id,x.target_id]));
  if(A.sel){const f=u.find(x=>x.id===A.sel.id);if(f)A.sel=f}}
 catch(e){A&&(A.err=msg(e))}
 if(A)paint()}
const nm=id=>{const p=P(id);return esc(p.display_name||p.username)};
const tags=u=>{const m=u.mod||{};return(m.staff?`<span class="tg">${esc(m.staff)}</span>`:'')+(m.banned?'<span class="tg b">Banned</span>':'')+(m.timed_out?'<span class="tg t">Timed out</span>':'')+(pres[u.id]?'<span class="tg o">Connected</span>':'')};
const logRow=x=>`<div class="row" style="align-items:flex-start"><div class="g1"><b>${K[x.kind]}</b> · ${nm(x.target_id)} <small class="m">by ${nm(x.actor_id)}</small>${x.reason?`<br><small>Reason: ${esc(x.reason)}</small>`:''}${x.notes?`<br><small class="m">Internal: ${esc(x.notes)}</small>`:''}<br><small class="m">${esc(fd(x.created_at))}${x.expires_at?' · expires '+esc(fd(x.expires_at)):(x.kind==='ban'?' · permanent':'')}${x.lifted_at?' · lifted '+esc(fd(x.lifted_at)):''}</small></div></div>`;
function paintList(){const l=document.getElementById('am-list');if(!l||!A)return;
 l.innerHTML=!A.users?'<p class="m">Loading…</p>':A.users.length?A.users.map(u=>`<div class="row ur" data-u="${esc(u.id)}">${av(u)}<div class="g1"><div class="t"><b>${esc(u.display_name||u.username)}</b>${tags(u)}</div><small class="m">@${esc(u.username)}${u.created_at?' · joined '+esc(new Date(u.created_at).toLocaleDateString()):''}</small></div></div>`).join(''):'<p class="m">No users match.</p>'}
function paint(){const o=document.getElementById('adm');if(!o||!A)return;const e=A.err?`<p class="err" role="alert">${esc(A.err)}</p>`:'';let h='';
 if(A.view==='list'){const s=A.stats||{};
  h=`<div class="bar"><h2>🛡️ Admin Panel <small class="m">${esc(role)}</small></h2><button class="g" data-x="close">Close</button></div>${e}
  <div class="tabs"><button class="${A.tab==='users'?'':'g'}" data-x="tab" data-t="users">Users</button><button class="${A.tab==='logs'?'':'g'}" data-x="tab" data-t="logs">Moderation log</button></div>`;
  if(A.tab==='users')h+=`<div class="st">${[['Users',s.users],['Banned now',s.active_bans],['Timed out',s.active_timeouts],['Total bans',s.total_bans]].map(([a,b])=>`<div class="card"><b>${b??'…'}</b><small class="m">${a}</small></div>`).join('')}</div>
   <div class="card"><h3>Recent actions</h3>${A.logs.slice(0,5).map(logRow).join('')||'<p class="m">No moderation actions yet.</p>'}</div>
   <input id="am-q" placeholder="Search username or display name" value="${esc(A.q)}" autocomplete="off"><select id="am-f">${[['all','All users'],['active','Not banned'],['banned','Banned'],['timeout','Timed out']].map(([k,t])=>`<option value="${k}" ${A.f===k?'selected':''}>${t}</option>`).join('')}</select><div id="am-list"></div>`;
  else h+=`<div class="card">${A.logs.map(logRow).join('')||'<p class="m">No moderation actions yet.</p>'}</div>`}
 else if(A.view==='detail'){const u=A.sel,m=u.mod||{},hist=A.logs.filter(x=>x.target_id===u.id);
  h=`<div class="bar"><button class="g" data-x="back">‹ Back</button></div>${e}<div class="card"><div class="row">${av(u)}<div class="g1"><h3>${esc(u.display_name||u.username)}${tags(u)}</h3><small class="m">@${esc(u.username)} · joined ${u.created_at?esc(new Date(u.created_at).toLocaleDateString()):'unknown'}</small></div></div>
  ${m.banned?`<p class="err">Banned ${m.ban_expires_at?'until '+esc(fd(m.ban_expires_at)):'permanently'}${m.ban_reason?' — '+esc(m.ban_reason):''}</p>`:''}${m.timed_out?`<p>Timed out until ${esc(fd(m.timeout_expires_at))} (can read, can’t send messages or call).</p>`:''}
  ${m.staff?'<p class="m">Staff accounts can’t be moderated here.</p>':['warn','timeout',m.timed_out&&'untimeout','ban',m.banned&&'unban'].filter(k=>k&&can(k)).map(k=>`<button class="${k==='ban'?'d':'g'}" style="margin:0 6px 6px 0" data-x="act" data-k="${k}">${K[k]}</button>`).join('')}</div>
  <div class="card"><h3>History</h3>${hist.map(logRow).join('')||'<p class="m">No previous actions.</p>'}</div>`}
 else if(A.view==='form'||A.view==='confirm'){const f=A.form,u=A.sel,k=f.k,conf=A.view==='confirm',ex=expiry();
  h=`<div class="bar"><button class="g" data-x="${conf?'edit':'back'}">‹ Back</button></div>${e}<div class="card"><h3>${K[k]} — ${esc(u.display_name||u.username)}</h3>`;
  if(conf)h+=`<p>${{ban:'Ban this user? They lose access to messaging, DMs, groups and calls immediately.',unban:'Remove this user’s ban and restore access?',timeout:'Time this user out? They can read but cannot send messages or start calls. This is not a ban.',untimeout:'End this user’s timeout now?',warn:'Send this user a warning?'}[k]}</p><p><b>Duration:</b> ${k==='ban'||k==='timeout'?(ex?esc(fd(ex)):'Permanent'):'—'}<br><b>Reason:</b> ${esc(f.reason||'(none)')}<br><small class="m">Internal notes: ${esc(f.notes||'(none)')}</small></p><button class="${k==='unban'||k==='untimeout'||k==='warn'?'':'d'}" style="width:100%" data-x="go" ${A.busy?'disabled':''}>${A.busy?'Working…':'Confirm '+K[k].split(' ').slice(1).join(' ')}</button>`;
  else{if(k==='ban'||k==='timeout')h+=`<label>Duration</label><select id="f-d">${[...(k==='ban'?[['perm','Permanent']]:[]),['1h','1 hour'],['1d','1 day'],['3d','3 days'],['7d','7 days'],['custom','Custom date/time']].map(([v,t])=>`<option value="${v}" ${f.d===v?'selected':''}>${t}</option>`).join('')}</select>${f.d==='custom'?`<input id="f-c" type="datetime-local" value="${esc(f.c||'')}">`:''}`;
   h+=`<label>Reason${k==='warn'||k==='ban'?' (shown to the user)':''}</label><textarea id="f-r" maxlength="500">${esc(f.reason||'')}</textarea><label>Internal moderator notes (staff only)</label><textarea id="f-n" maxlength="2000">${esc(f.notes||'')}</textarea><button style="width:100%" data-x="review">Review</button>`}
  h+='</div>'}
 o.innerHTML=`<div class="w">${h}</div>`;if(A.view==='list'&&A.tab==='users')paintList()}
function expiry(){const f=A.form;if(!f||!['ban','timeout'].includes(f.k))return null;if(f.d==='custom')return f.c?new Date(f.c).toISOString():null;return DUR[f.d]?new Date(Date.now()+DUR[f.d]).toISOString():null}
document.addEventListener('click',async e=>{
 const adm=e.target.closest('[data-adm]');if(adm){openAdm();return}
 if(!A)return;const t=e.target.closest('[data-x],[data-u]');if(!t)return;
 if(t.dataset.u){A.sel=A.users.find(x=>x.id===t.dataset.u);A.view='detail';A.err='';return paint()}
 const x=t.dataset.x;
 if(x==='close')closeAdm();
 else if(x==='tab'){A.tab=t.dataset.t;paint()}
 else if(x==='back'){A.view=A.view==='form'?'detail':'list';A.err='';paint()}
 else if(x==='edit'){A.view='form';paint()}
 else if(x==='act'){const k=t.dataset.k;A.form={k,d:k==='ban'?'perm':'1h',c:'',reason:'',notes:''};A.view='form';A.err='';paint()}
 else if(x==='review'){const f=A.form;f.reason=document.getElementById('f-r').value.trim();f.notes=document.getElementById('f-n').value.trim();
  if(['ban','timeout'].includes(f.k)&&f.d==='custom'){f.c=(document.getElementById('f-c')||{}).value;if(!f.c||new Date(f.c)<=new Date()){A.err='Pick a custom time in the future.';return paint()}}
  A.err='';A.view='confirm';paint()}
 else if(x==='go'){if(A.busy)return;A.busy=true;paint();const f=A.form;
  try{await rpc('mod_'+f.k,{p_target:A.sel.id,p_reason:f.reason||null,p_expires:expiry(),p_notes:f.notes||null});toast(K[f.k]+' applied.');A.view='detail';A.busy=false;await reload()}
  catch(er){A.busy=false;A.err=msg(er);A.view='form';paint()}}});
document.addEventListener('input',e=>{if(!A)return;if(e.target.id==='am-q'){clearTimeout(A.qt);A.q=e.target.value;A.qt=setTimeout(reload,300)}});
document.addEventListener('change',e=>{if(!A)return;if(e.target.id==='am-f'){A.f=e.target.value;reload()}
 else if(e.target.id==='f-d'){A.form.reason=document.getElementById('f-r').value;A.form.notes=document.getElementById('f-n').value;A.form.d=e.target.value;paint()}});

/* ---------- servers, stage 1 (tables/RPCs from stage1_servers.sql; all permission checks run in the database) ---------- */
S.srv=[];let SV=null,sxt;const SBK='server-media';
const serr=e=>{const m=(e&&e.message)||'Something went wrong.';return /srv_|schema cache|does not exist|PGRST20[25]|42P01/i.test(m+((e&&e.code)||''))?'Servers aren’t set up in the database yet. Run stage1_servers.sql in the Supabase SQL editor.':m};
const asrcS=u=>typeof u==='string'&&(u.startsWith(SUPABASE_URL+'/storage/v1/object/public/server-media/')||u.startsWith(SUPABASE_URL+'/storage/v1/object/public/server-attach/'));
const sIc=s=>asrcS(s.icon_url)?`<img src="${esc(s.icon_url)}" alt="" draggable="false">`:esc([...(s.name||'?')][0].toUpperCase());
async function loadSrv(){if(!S.me)return;
 try{const{data,error}=await sb.from('srv_members').select('joined_at,srv_servers(id,name,description,icon_url,banner_url,owner_id,is_public,category,accent)').eq('user_id',S.me.id).order('joined_at');if(error)throw error;S.srv=data.map(x=>x.srv_servers).filter(Boolean)}
 catch(e){S.srv=[];if(!S.srvWarned){S.srvWarned=1;toast(serr(e))}}srvRail();if(S.srv.length){srvRT();loadUnread()}}
function srvRail(){const r=$('.rail');if(!r)return;
 r.innerHTML=`<button class="rb on" data-a="tab" data-id="chats" aria-label="Home" title="Messages">${I('chat')}</button><i class="rsep"></i>`+S.srv.map(s=>`<button class="rb sv" data-sv="open" data-id="${esc(s.id)}" aria-label="${esc(s.name)}" title="${esc(s.name)}">${sIc(s)}${bdgS(s.id)}</button>`).join('')+`<button class="rb" data-a="srvn" aria-label="Create a server" title="Create a server">${I('plus')}</button><button class="rb" data-sv="disc" aria-label="Discover public servers" title="Discover servers">🧭</button>`}
function smod(h,c){const o0=$('#smod');if(o0)o0.remove();const o=document.createElement('div');o.id='smod';if(c)o.className=c;o.setAttribute('role','dialog');o.innerHTML=`<div class="sm-w">${h}</div>`;document.body.appendChild(o)}
const smx=()=>{const o=$('#smod');if(o)o.remove()};
const TPL=[{id:'gaming',e:'🎮',n:'Gaming',d:'Clips, media and voice'},{id:'friends',e:'👥',n:'Friends',d:'Chat, memes and hangouts'},{id:'creator',e:'🎨',n:'Creator',d:'Showcase and feedback'},{id:'community',e:'📚',n:'Community',d:'Events and introductions'},{id:'esports',e:'🏆',n:'Esports',d:'Scrims and team voice'},{id:'support',e:'🛠️',n:'Support',d:'Help, FAQ and feedback'}];
const ACC=['#7c5cff','#3b82f6','#06b6d4','#10b981','#f59e0b','#ef4444','#ec4899'];let W=null;
function srvCreate(){W={step:1,tpl:'scratch',name:'',desc:'',pub:false,adv:false,acc:'#7c5cff',icon:null,ban:null,err:''};wzPaint()}
function wzPaint(){if(!W)return;let h;
 if(W.step===1)h=`<h2>Create your server</h2><p class="m">Your server is where you and your friends can hang out, chat, and build a community.</p><button class="wz-card big" data-sv="wz-tpl" data-id="scratch"><span class="wz-e">✨</span><span><b>Start from scratch</b><br><small class="m">One #general channel. Build the rest yourself.</small></span></button><small class="m wz-l">OR USE A TEMPLATE</small><div class="wz-g">${TPL.map(t=>`<button class="wz-card" data-sv="wz-tpl" data-id="${t.id}"><span class="wz-e">${t.e}</span><b>${t.n}</b><small class="m">${t.d}</small></button>`).join('')}</div><div class="pact"><button class="g" data-sv="x">Cancel</button></div>`;
 else h=`<div class="row"><button class="g" data-sv="wz-back">‹ Back</button><small class="m g1" style="text-align:right">${W.tpl==='scratch'?'From scratch':esc(TPL.find(t=>t.id===W.tpl).n+' template')}</small></div><h2>Tell us about your server</h2><p class="m">Give it a name and an icon. You can change both later.</p>
 <div class="wz-ic" data-sv="wz-icon" role="button" tabindex="0" aria-label="Upload server icon">${W.icon?`<img src="${W.icon.url}" alt="Icon preview">`:'<span>📷<br><small>Add icon</small></span>'}</div>
 ${W.icon?'<div class="wz-ia"><button class="g" data-sv="wz-icon">Replace</button><button class="g" data-sv="wz-ico-rm">Remove</button></div>':''}
 <input id="wz-fi" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
 <label for="wz-n">What’s your server’s name?</label><input id="wz-n" maxlength="60" placeholder="My awesome server" autocomplete="off" value="${esc(W.name)}">
 <label for="wz-d">Description (optional)</label><textarea id="wz-d" maxlength="500" rows="2" placeholder="What’s it about?">${esc(W.desc)}</textarea>
 <button class="g wz-adv" data-sv="wz-adv">⚙️ Advanced settings ${W.adv?'▴':'▾'}</button>
 ${W.adv?`<div class="card" style="margin-top:10px"><label>Server type</label><div class="wz-sg"><button class="${W.pub?'':'on'}" data-sv="wz-pub" data-id="0">🔒 Private</button><button class="${W.pub?'on':''}" data-sv="wz-pub" data-id="1">🌐 Public</button></div><small class="m">${W.pub?'Anyone can find and join it in Discover.':'People need an invite to join.'}</small><label style="margin-top:10px">Banner (optional, GIFs OK)</label><div class="wz-bn" data-sv="wz-ban">${W.ban?`<img src="${W.ban.url}" alt="Banner preview">`:'🖼️ Add banner'}</div>${W.ban?'<button class="g" data-sv="wz-ban-rm" style="margin-top:6px">Remove banner</button>':''}<input id="wz-bi" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden><label style="margin-top:10px">Accent colour</label><div class="wz-ac">${ACC.map(c=>`<button class="${W.acc===c?'on':''}" style="background:${c}" data-sv="wz-acc" data-id="${c}" aria-label="Accent ${c}"></button>`).join('')}</div></div>`:''}
 <p class="err" role="alert">${esc(W.err)}</p><div class="pact"><button class="g" data-sv="wz-back">Back</button><button id="sc-go" data-sv="mk">Create server</button></div>`;
 smod(h,'wz')}
async function srvMake(){if(!W)return;const b=$('#sc-go'),n=W.name.trim();if(n.length<2){W.err='The name needs at least 2 characters.';return wzPaint()}
 b.disabled=true;b.textContent='Creating…';
 try{const up=(f,k)=>f?upload(`${S.me.id}/${Date.now()}-${k}`,f.blob,f.mime,()=>{},SBK):null;
  const icon=await up(W.icon,'icon'),ban=await up(W.ban,'banner');
  const id=await rpc('srv_create',{p_name:n,p_description:W.desc.trim()||null,p_category:W.tpl,p_public:W.pub,p_icon_url:icon,p_banner_url:ban,p_template:W.tpl,p_accent:W.acc});
  W=null;smx();await loadSrv();toast('Server created.');srvOpen(id)}
 catch(er){if(W){W.err=serr(er);wzPaint()}}}
async function srvDisc(q=''){if(!$('#sx-l'))smod(`<h2>Discover servers</h2><input id="sx-q" placeholder="Search public servers" autocomplete="off"><div id="sx-l" class="m">Loading…</div><div class="pact"><button class="g" data-sv="x">Close</button></div>`);
 try{const r=await rpc('srv_discover',{p_q:q,p_limit:30}),l=$('#sx-l');if(!l)return;

async function srvOpen(id){const s=S.srv.find(x=>x.id===id);if(!s)return;if(SV&&SV.ti)clearInterval(SV.ti);SV={s,ch:[],mem:[],sel:null,mob:'ch',pm:[],msgs:[],rx:{},att:[],reply:null,typ:{}};

 try{const[c,m]=await Promise.all([sb.from('srv_channels').select('*').eq('server_id',id).order('position'),sb.from('srv_members').select('user_id,joined_at').eq('server_id',id)]);if(c.error)throw c.error;if(m.error)throw m.error;if(!SV||SV.s.id!==id)return;
  SV.ch=c.data;SV.mem=m.data;SV.pm=(await rpc('srv_my_perms',{p_server:id}))||[];await prof(m.data.map(x=>x.user_id));if(!SV||SV.s.id!==id)return;SV.sel=(c.data.find(x=>x.kind==='text')||{}).id||null}
 catch(er){if(SV)SV.err=serr(er)}srvPaint();

  SV.ti=setInterval(typePaint,1500);chatLoad()}}

async function rtMsg(t,m){
 if(t==='D'){if(SV){const i=SV.msgs.findIndex(x=>x.id===m.id);if(i>=0){SV.msgs.splice(i,1);msgPaint()}}return}
 if(t==='U'){if(SV){const x=SV.msgs.find(y=>y.id===m.id);if(x){Object.assign(x,m);msgPaint()}}return}
 if(SV&&SV.sel===m.channel_id){if(!SV.msgs.some(x=>x.id===m.id)){await prof([m.author_id]);if(SV&&SV.sel===m.channel_id&&!SV.msgs.some(x=>x.id===m.id)){SV.msgs.push(m);msgPaint(m.author_id===S.me.id);if(m.author_id!==S.me.id)srvRead(m.channel_id)}}}
 else if(m.author_id!==S.me.id&&S.srv.some(s=>s.id===m.server_id)){const u=S.unread[m.channel_id];S.unread[m.channel_id]={s:m.server_id,n:(u?u.n:0)+1};srvBadges()}}
function chHtml(){const row=c=>{const u=S.unread[c.id];return `<div class="ci${SV.sel===c.id?' on':''}${u?' un':''}" data-sv="ch" data-id="${esc(c.id)}"><span class="m">${c.kind==='voice'?'🔊':'#'}</span><div class="g1 t">${esc(c.name)}</div>${u?`<span class="bdg">${u.n>99?'99+':u.n}</span>`:''}</div>`};
 return SV.err?`<p class="err">${esc(SV.err)}</p>`:(SV.ch.filter(c=>c.kind==='category').map(g=>`<small class="m svc">${esc(g.name).toUpperCase()}</small>`+SV.ch.filter(c=>c.parent_id===g.id).map(row).join('')).join('')+SV.ch.filter(c=>c.kind!=='category'&&!c.parent_id).map(row).join(''))||'<p class="empty">Loading…</p>'}
function chatHtml(cur){if(!cur)return '<div class="svb"><div class="empty"><h3>Welcome</h3><p>Pick a channel.</p></div></div>';
 if(cur.kind==='voice')return `<div class="svb"><div class="empty"><h3>🔊 ${esc(cur.name)}</h3><p>Voice channels aren’t connected to calls yet.</p></div></div>`;
 return `<div class="chat">${cur.description?`<small class="m" style="padding:6px 14px">${esc(cur.description)}</small>`:''}<div id="sm-l" class="sml"></div><div id="sm-t" class="smt"></div><div id="sm-r" class="smr"></div>${hasP('send_messages')?`<div class="cmp2"><button class="g" data-sv="att" aria-label="Attach files">📎</button><textarea id="sm-i" rows="1" maxlength="4000" placeholder="Message #${esc(cur.name)}"></textarea><button data-sv="send">Send</button></div><input id="sm-f" type="file" multiple hidden>`:'<p class="m" style="padding:12px 14px;border-top:1px solid var(--line)">You can’t send messages in this channel.</p>'}</div>`}
function msgHtml(m){const p=P(m.author_id),rp=m.reply_to&&SV.msgs.find(x=>x.id===m.reply_to),rx=SV.rx[m.id]||{},mu=(P(S.me.id).username||'').toLowerCase();
 const txt=esc(m.content).replace(/@([a-z0-9_]{3,20})\b/gi,(a,u)=>SV.mem.some(k=>(P(k.user_id).username||'').toLowerCase()===u.toLowerCase())?`<span class="mn${u.toLowerCase()===mu?' me':''}">@${u}</span>`:a);
 const at=(m.attachments||[]).filter(a=>asrcS(a.url)).map(a=>/^image\//.test(a.type||'')?`<a data-sv="lnk" href="${esc(a.url)}" target="_blank" rel="noopener"><img class="at" src="${esc(a.url)}" alt="${esc(a.name)}" loading="lazy"></a>`:`<a class="atf" data-sv="lnk" href="${esc(a.url)}" target="_blank" rel="noopener">📎 ${esc(a.name)}</a>`).join('');
 const rc=Object.keys(rx).map(e=>`<button class="rxc${rx[e].includes(S.me.id)?' on':''}" data-sv="rx" data-id="${m.id}" data-e="${esc(e)}">${esc(e)} ${rx[e].length}</button>`).join('');
 return `<div class="m2" data-sv="msg" data-id="${m.id}">${av(p)}<div class="g1">${m.reply_to?`<div class="rpv">↩ ${rp?esc((P(rp.author_id).display_name||P(rp.author_id).username||'')+': '+(rp.content||'attachment')):'original message'}</div>`:''}<div class="mh"><b>${esc(p.display_name||p.username||'User')}</b><time>${esc(tmf(m.created_at))}</time>${m.pinned?'<small>📌</small>':''}${m.edited_at?'<small class="m">(edited)</small>':''}</div>${txt?`<div class="tx">${txt}</div>`:''}${at}${rc?`<div class="rxs">${rc}</div>`:''}</div></div>`}
function msgPaint(stick){const l=$('#sm-l');if(!l||!SV)return;const near=l.scrollHeight-l.scrollTop-l.clientHeight<140;
 l.innerHTML=(SV.more?'<button class="g" data-sv="older" style="margin:6px auto 10px;display:block">Load older messages</button>':'')+(SV.msgs.length?SV.msgs.map(msgHtml).join(''):'<p class="empty">No messages yet. Say hello 👋</p>');if(stick||near)l.scrollTop=l.scrollHeight}
function barPaint(){const r=$('#sm-r');if(!r||!SV)return;r.innerHTML=(SV.reply?`<span class="chip">↩ Replying to ${esc(P(SV.reply.author_id).display_name||P(SV.reply.author_id).username||'')}<button class="g" data-sv="rmrep" aria-label="Cancel reply">✕</button></span>`:'')+SV.att.map((a,i)=>`<span class="chip">📎 ${esc(a.name)}<button class="g" data-sv="rmat" data-id="${i}" aria-label="Remove">✕</button></span>`).join('')}

async function chatLoad(){const c=SV&&SV.ch.find(x=>x.id===SV.sel);SV.msgs=[];SV.rx={};if(!c||c.kind!=='text')return;const id=SV.sel;
 const{data,error}=await sb.from('srv_messages').select('*').eq('channel_id',id).order('created_at',{ascending:false}).limit(50);if(error){toast(serr(error));return}
 if(!SV||SV.sel!==id)return;SV.more=data.length===50;SV.msgs=data.reverse();await prof(SV.msgs.map(m=>m.author_id));if(!SV||SV.sel!==id)return;msgPaint(true);rxLoad();srvRead(id)}

 SV.more=data.length===50;await prof(data.map(m=>m.author_id));SV.msgs=data.reverse().concat(SV.msgs);const l=$('#sm-l'),h0=l.scrollHeight;msgPaint();l.scrollTop=l.scrollHeight-h0;rxLoad()}

 const rx={};(data||[]).forEach(r=>{rx[r.message_id]=rx[r.message_id]||{};rx[r.message_id][r.emoji]=rx[r.message_id][r.emoji]||[];rx[r.message_id][r.emoji].push(r.user_id)});SV.rx=rx;msgPaint()}

function srvClose(){const o=$('#sv');if(o)o.remove();if(SV&&SV.ti)clearInterval(SV.ti);if(TC){sb.removeChannel(TC);TC=null}SV=null;if(!document.getElementById('bangate')&&!A)document.body.style.overflow=''}

 try{if(x==='x'){smx();W=null}else if(x==='mk')await srvMake();else if(x==='disc')srvDisc();

  else if(x==='wz-ico-rm'){if(W.icon)URL.revokeObjectURL(W.icon.url);W.icon=null;wzPaint()}else if(x==='wz-ban-rm'){if(W.ban)URL.revokeObjectURL(W.ban.url);W.ban=null;wzPaint()}

  else if(x==='edit'){const m=SV.msgs.find(y=>y.id===id);smod(`<h2>Edit message</h2><textarea id="ed-t" rows="4" maxlength="4000">${esc(m.content)}</textarea><div class="pact"><button class="g" data-sv="x">Cancel</button><button data-sv="edsave" data-id="${id}">Save</button></div>`)}
  else if(x==='edsave'){const v=$('#ed-t').value;await rpc('srv_msg_edit',{p_msg:id,p_content:v});const m=SV.msgs.find(y=>y.id===id);if(m){m.content=v.trim();m.edited_at=new Date().toISOString()}smx();msgPaint()}

   smod(`<h2>📌 Pinned messages</h2>${data.length?data.map(m=>`<div class="card"><b>${esc(P(m.author_id).display_name||P(m.author_id).username||'')}</b> <small class="m">${esc(tmf(m.created_at))}</small><div style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(m.content||'(attachment)')}</div></div>`).join(''):'<p class="empty">Nothing pinned yet.</p>'}<div class="pact"><button class="g" data-sv="x">Close</button></div>`)}else if(x==='back'){SV.mob='ch';srvPaint()}
  else if(x==='mem'){SV.mob=SV.mob==='mem'?'main':'mem';srvPaint()}else if(x==='menu')await srvMenu();else if(x==='mch')srvChModal('ch');else if(x==='mcat')srvChModal('category');else if(x==='chmk')await srvChMake(id);else if(x==='del')srvDel();
  else if(x==='dgo'){const v=$('#sd-n').value;t.disabled=true;await rpc('srv_delete',{p_server:SV.s.id,p_confirm_name:v});smx();srvClose();await loadSrv();toast('Server deleted.')}

 catch(er){toast(serr(er));t.disabled=false}});
