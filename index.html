function endCard(c,msg){const n=new Date(),now=n.toISOString(),ago=x=>new Date(n-x).toISOString(),me=S.me.id;let r;

async function mic(){if(!navigator.mediaDevices||!window.RTCPeerConnection){toast('This browser does not support voice calls.');return null}

const SHARE=!!(navigator.mediaDevices&&navigator.mediaDevices.getDisplayMedia),ICE={iceServers:[{urls:['stun:stun.l.google.com:19302','stun:stun1.l.google.com:19302']}]};

  if(d.type==='offer'){await pc.setLocalDescription();send('answer',pc.localDescription.toJSON())}}catch(e){console.error(e)}};
 p.handle=(k,d)=>{p.q=p.q.then(()=>run(k,d))};return p}
function mkpc(){const p=peer(sig,C.dir==='in',C.stream,e=>{if(e.track.kind==='audio'){au.srcObject=e.streams[0];au.play().catch(()=>{})}else{e.track.onunmute=()=>{C.vs=new MediaStream([e.track]);ui()};e.track.onmute=()=>{C.vs=null;ui()}}},s=>{if(!C)return;if(s==='connected'){C.up=1;C.t0=C.t0||Date.now();C.st='Connected'}else if(s==='connecting')C.st='Connecting…';else if(s==='disconnected')C.st='Reconnecting…';else if(s==='failed')return fin('Connection lost.',true);upd()});C.p=p;C.pc=p.pc;return p}

function ui(){let o=$('#call');if(!o){o=document.createElement('div');o.id='call';o.setAttribute('role','dialog');o.setAttribute('aria-label','Voice call');document.body.appendChild(o)}

let G=null;

async function joinGroup(){if(C||G)return toast('You are already in a call.');if(!S.cv||S.cv.kind!=='group')return;const s=await mic();if(!s)return;
 try{const d=await R('join_group_call',{conv:S.cv.id});G={id:d.id,conv:S.cv.id,title:S.cv.name||'Group chat',stream:s,peers:{},m:{},sn:{},lv:{},ac:new(window.AudioContext||window.webkitAudioContext)()};G.ac.resume().catch(()=>{});
  await prof(d.participants);d.participants.forEach(gPeer);watch(S.me.id,s);await gRefresh();G.tm=setInterval(gSpeak,200);gBanner()}catch(e){s.getTracks().forEach(t=>t.stop());G=null;toast(e.message||'Couldn’t join the call.')}}
function watch(u,st){if(!G)return;try{const an=G.ac.createAnalyser();an.fftSize=256;G.ac.createMediaStreamSource(st).connect(an);G.lv[u]=an}catch(e){}}

function gPeer(u){if(!G)return;if(G.peers[u])return G.peers[u];const id=G.id,send=(k,pl)=>sb.from('group_signals').insert({call_id:id,sender:S.me.id,receiver:u,kind:k,payload:pl}).then(({error})=>error&&console.error(error));
 const p=peer(send,S.me.id>u,G.stream,e=>{if(!G||!G.peers[u])return;if(e.track.kind==='audio'){let a=G.peers[u].au;if(!a){a=G.peers[u].au=document.createElement('audio');a.autoplay=true;a.setAttribute('playsinline','');document.body.appendChild(a)}a.srcObject=e.streams[0];a.play().catch(()=>{});watch(u,e.streams[0])}else{e.track.onunmute=()=>{if(G&&G.peers[u]){G.peers[u].vs=new MediaStream([e.track]);gui()}};e.track.onmute=()=>{if(G&&G.peers[u]){G.peers[u].vs=null;gui()}}}},st=>{if(st==='failed')gDrop(u)});
 G.peers[u]=p;if(G.share)G.sn[u]=p.pc.addTrack(G.share.getVideoTracks()[0],G.share);return p}
function gDrop(u){if(!G||!G.peers[u])return;const p=G.peers[u];try{p.pc.close()}catch(e){}if(p.au){p.au.srcObject=null;p.au.remove()}delete G.peers[u];delete G.lv[u];delete G.sn[u];gui()}

 <div class="gp">${ids.map(u=>`<div class="gt" data-u="${u}">${av(P(u))}<span>${esc(u===S.me.id?'You':nm(u))}</span>${(u===S.me.id?G.muted:(G.m[u]||{}).muted)?I('micoff',16):''}</div>`).join('')}</div>
 <div class="gv">${vids.map(u=>`<div style="width:100%"><video data-vu="${u}" playsinline autoplay muted></video><small>${esc(nm(u))} is sharing their screen</small></div>`).join('')}</div>
 <div class="cacts"><button class="cb ${G.muted?'on':''}" data-c="gmute" aria-pressed="${!!G.muted}" aria-label="${G.muted?'Unmute microphone':'Mute microphone'}">${I(G.muted?'micoff':'mic',28)}</button>${SHARE?`<button class="cb ${G.share?'on':''}" data-c="share" aria-pressed="${!!G.share}" aria-label="${G.share?'Stop sharing screen':'Share screen'}">${I('screen',28)}</button>`:''}<button class="cb red" data-c="gleave" aria-label="Leave call">${I('phone',28)}</button></div>`;
 vids.forEach(u=>{const v=o.querySelector(`video[data-vu="${u}"]`);if(v){v.srcObject=G.peers[u].vs;v.play().catch(()=>{})}})}

 if(c==='call')startCall();else if(c==='acc')accept();else if(c==='dec')fin('',false,'decline');else if(c==='end')fin('Call ended.',true);else if(c==='gjoin')joinGroup();else if(c==='gleave')gLeave('You left the call.');else if(c==='gmute')gMute();else if(c==='share')(G?gShare:dShare)();
 else if(c==='mute'&&C){C.muted=!C.muted;C.stream.getAudioTracks().forEach(x=>x.enabled=!C.muted);ui()}

});

<script>

let MF='all';
async function mb(t){await loadMem();if(!live(t))return;body().innerHTML=`<p class="gs-d">${Z.mem.length} member${Z.mem.length==1?'':'s'} in this group.</p><input id="gsq" type="search" placeholder="Search members" aria-label="Search members"><div class="gs-chips" role="group">${[['all','All'],['admin','Admins'],['member','Members']].map(([k,l])=>`<button data-c="gsf" data-k="${k}" class="${MF===k?'on':''}">${l}</button>`).join('')}</div><div id="gml"></div>`;paintMem()}
function paintMem(){const q=($('#gsq')||{value:''}).value.toLowerCase(),L=$('#gml');if(!L)return;const rk={owner:0,admin:1,member:2},rows=Z.mem.filter(m=>{const u=P(m.user_id);return(MF==='all'||(MF==='admin'?m.role!=='member':m.role==='member'))&&(u.display_name+' '+u.username).toLowerCase().includes(q)}).sort((a,b)=>rk[a.role]-rk[b.role]);
 L.innerHTML=rows.length?rows.map(m=>{const u=P(m.user_id);return `<div class="gs-row">${av(u)}<div class="g1"><b>${esc(u.display_name||u.username)}</b><br><small>@${esc(u.username)}</small></div>${m.role!=='member'?`<span class="gs-pill">${m.role==='owner'?'Owner':'Admin'}</span>`:''}${can(m)?`<button class="g" data-c="gsm" data-id="${m.user_id}" aria-label="Manage ${esc(u.display_name||u.username)}">Manage</button>`:''}</div>`}).join(''):em('No members match.')}
function memSheet(id){const m=Z.mem.find(x=>x.user_id===id),u=P(id);if(!m||!can(m))return;const d=document.createElement('div');d.className='cdlg';d.style.zIndex=110;d.innerHTML=`<div class="cbx"><div class="gs-row" style="background:none;padding:0">${av(u)}<div class="g1"><b>${esc(u.display_name)}</b><br><small>@${esc(u.username)} · ${m.role}</small></div></div><div style="display:flex;flex-direction:column;gap:8px;margin-top:14px">${own()?`<button class="g" data-x="adm">${m.role==='admin'?'Remove admin role':'Make admin'}</button>`:''}<button class="g" data-x="rm">Remove from group</button><button class="dng" data-x="ban">Ban from group</button><button class="g" data-x="no">Cancel</button></div></div>`;
 d.onclick=async e=>{const b=e.target.closest('[data-x]');if(!b&&e.target!==d)return;d.remove();if(!b)return;const x=b.dataset.x,n=u.display_name||u.username;
  if(x==='adm'){if(await run(()=>R('group_set_admin',{cid:Z.cid,uid:id,make_admin:m.role!=='admin'}),m.role==='admin'?'Admin role removed.':n+' is now an admin.')){await sync();show('members')}}
  else if(x==='rm'&&await ask('Remove '+n+' from this group?','Remove',1)){if(await run(()=>R('group_remove_member',{cid:Z.cid,uid:id}),'Member removed.')){await sync();show('members')}}
  else if(x==='ban'&&await ask('Ban '+n+'? They can’t rejoin until unbanned.','Ban',1)){if(await run(()=>R('gc_ban',{cid:Z.cid,uid:id}),'Member banned.')){await sync();show('members')}}};document.body.appendChild(d)}
/* ---- Invites & joining ---- */
const JMO={invite:'Anyone with an invite link',approval:'Members must be approved',admins:'Only admins can add people'};
async function jn(t){const[a,b]=await Promise.all([sb.from('gc_invites').select('*').eq('conversation_id',Z.cid).order('created_at',{ascending:false}),sb.from('gc_requests').select('*').eq('conversation_id',Z.cid)]);const iv=a.data||[],rq=b.data||[];await prof([...iv.map(x=>x.created_by),...rq.map(x=>x.user_id)]);if(!live(t))return;
 body().innerHTML=`<p class="gs-d">Control how people get into this group.</p><div class="gs-card"><h3>Who can join</h3>${own()?`<select id="gsjm" aria-label="Join mode">${Object.entries(JMO).map(([k,l])=>`<option value="${k}" ${(S.cv.join_mode||'invite')===k?'selected':''}>${l}</option>`).join('')}</select>`:`<p class="m">${JMO[S.cv.join_mode||'invite']}</p><small class="m">Only the owner can change this.</small>`}</div>
 <div class="gs-card"><h3>Join requests (${rq.length})</h3>${rq.length?rq.map(x=>{const u=P(x.user_id);return `<div class="gs-row" style="background:none;padding:6px 0">${av(u)}<div class="g1"><b>${esc(u.display_name)}</b></div><button data-c="gsrq" data-id="${x.id}" data-v="1">Approve</button><button class="g" data-c="gsrq" data-id="${x.id}" data-v="0">Deny</button></div>`}).join(''):'<p class="m">No pending requests.</p>'}</div>
 <div class="gs-card"><h3>Create invite link</h3><input id="gsin" placeholder="Name (optional)" maxlength="40" aria-label="Invite name"><select id="gsih" aria-label="Expires"><option value="">Never expires</option><option value="1">Expires in 1 hour</option><option value="24">Expires in 24 hours</option><option value="168">Expires in 7 days</option></select><select id="gsiu" aria-label="Max uses"><option value="">Unlimited uses</option><option value="1">1 use</option><option value="5">5 uses</option><option value="25">25 uses</option></select><button data-c="gsic" style="width:100%;margin-top:8px">Create invite</button></div>
 <h3>Invite links</h3>${iv.length?iv.map(x=>{const dead=x.revoked||(x.expires_at&&new Date(x.expires_at)<new Date())||(x.max_uses&&x.uses>=x.max_uses);return `<div class="gs-card"><b>${esc(x.name||'Invite')}</b> ${dead?'<span class="gs-pill" style="background:var(--line);color:var(--mute)">Inactive</span>':''}<br><small class="m">${esc(x.code)} · ${x.uses}${x.max_uses?'/'+x.max_uses:''} uses${x.expires_at?' · expires '+dt(x.expires_at):''}<br>Created by ${esc(P(x.created_by).display_name)}</small>${dead?'':`<div style="display:flex;gap:8px;margin-top:10px"><button class="g" data-c="gscp" data-id="${esc(x.code)}">Copy link</button><button class="dng" data-c="gsiv" data-id="${x.id}">Revoke</button></div>`}</div>`}).join(''):em('No invite links yet. Create one above.')}`}
/* ---- Moderation ---- */
async function md(t){const{data}=await sb.from('gc_bans').select('*').eq('conversation_id',Z.cid);const bn=data||[];await prof(bn.map(x=>x.user_id));if(!live(t))return;body().innerHTML=`<p class="gs-d">Banned people can’t rejoin until you unban them. Ban members from the Members page.</p><h3>Banned (${bn.length})</h3>${bn.length?bn.map(x=>{const u=P(x.user_id);return `<div class="gs-row">${av(u)}<div class="g1"><b>${esc(u.display_name)}</b><br><small>@${esc(u.username)}</small></div><button class="g" data-c="gsub" data-id="${x.user_id}">Unban</button></div>`}).join(''):em('Nobody is banned.')}`}
/* ---- Audit ---- */
const AL={join_mode_changed:'changed who can join',picture_changed:'changed the picture',banner_changed:'changed the banner'};let AU=[],AF={u:'',a:'',r:''};
async function au(t){const{data,error}=await sb.from('group_audit_log').select('*').eq('conversation_id',Z.cid).order('created_at',{ascending:false}).limit(200);if(error)throw error;AU=data||[];await prof(AU.flatMap(a=>[a.actor_id,a.target_id]));if(!live(t))return;const us=[...new Set(AU.map(a=>a.actor_id))],ac=[...new Set(AU.map(a=>a.action))];
 body().innerHTML=`<p class="gs-d">Recent changes to this group and who made them.</p><div class="gs-chips" style="flex-direction:column;gap:8px"><select id="gsau" aria-label="Filter by person"><option value="">Everyone</option>${us.map(u=>`<option value="${u}">${esc(P(u).display_name)}</option>`).join('')}</select><select id="gsaa" aria-label="Filter by action"><option value="">All actions</option>${ac.map(a=>`<option value="${esc(a)}">${esc(AL[a]||a.replace(/_/g,' '))}</option>`).join('')}</select><select id="gsar" aria-label="Filter by date"><option value="">Any time</option><option value="1">Last 24 hours</option><option value="7">Last 7 days</option><option value="30">Last 30 days</option></select></div><div id="gsal"></div>`;paintAu()}
function paintAu(){const u=$('#gsau').value,a=$('#gsaa').value,r=$('#gsar').value,min=r?Date.now()-r*864e5:0,rows=AU.filter(x=>(!u||x.actor_id===u)&&(!a||x.action===a)&&new Date(x.created_at)>=min);$('#gsal').innerHTML=rows.length?rows.map(x=>`<div class="gs-row"><div class="g1"><small>${dt(x.created_at)}</small><div><b>${esc(P(x.actor_id).display_name)}</b> ${esc(AL[x.action]||x.action.replace(/_/g,' '))} ${x.target_id?'<b>'+esc(P(x.target_id).display_name)+'</b>':''}</div></div></div>`).join(''):em('No matching activity.')}
document.addEventListener('change',e=>{if(['gsau','gsaa','gsar'].includes(e.target.id))paintAu();else if(e.target.id==='gsjm')run(async()=>{await R('gc_set_join_mode',{cid:Z.cid,mode:e.target.value});await sync()},'Saved.');else if(e.target.id==='gsmu'){const h=+e.target.value;run(async()=>{const{error}=await mine({muted_until:h===0?null:h<0?'9999-12-31T00:00:00Z':new Date(Date.now()+h*36e5).toISOString()});if(error)throw error;await sync();show('notify')},'Saved.')}});
/* ---- Notifications ---- */
async function nt(t){await loadMem();if(!live(t))return;const m=Z.mem.find(x=>x.user_id===S.me.id)||{},mu=m.muted_until&&new Date(m.muted_until)>new Date(),mo=(m.notify||'all')==='mentions',no=m.notify==='none';
 body().innerHTML=`<p class="gs-d">These only affect you, not other members.</p><div class="gs-card"><div class="gs-sw"><div class="g1"><b>Mentions only</b><small>Only notify me when someone mentions me.</small></div><button class="tg" role="switch" aria-checked="${mo}" aria-label="Mentions only" data-c="gstg" data-v="${mo?'all':'mentions'}"></button></div><div class="gs-sw"><div class="g1"><b>Silence all messages</b><small>No notifications from this group.</small></div><button class="tg" role="switch" aria-checked="${no}" aria-label="Silence all messages" data-c="gstg" data-v="${no?'all':'none'}"></button></div></div>
 <div class="gs-card"><h3>Mute</h3><select id="gsmu" aria-label="Mute duration"><option value="0" ${mu?'':'selected'}>Not muted</option><option value="1">Mute for 1 hour</option><option value="8">Mute for 8 hours</option><option value="24">Mute for 24 hours</option><option value="-1" ${mu&&m.muted_until.startsWith('9999')?'selected':''}>Until I turn it back on</option></select>${mu?`<small class="m">Muted ${m.muted_until.startsWith('9999')?'until you turn it back on':'until '+dt(m.muted_until)}</small>`:''}</div>`}
/* ---- Danger ---- */
async function dz(t){await loadMem();if(!live(t))return;const o=own(),others=Z.mem.filter(m=>m.user_id!==S.me.id);
 body().innerHTML=`<p class="gs-d">These actions are serious. Read before you tap.</p>${o?`<div class="gs-card gs-dz"><h3>Transfer ownership</h3><p class="m">Give this group to another member. You become an admin.</p><select id="gstr" aria-label="New owner"><option value="">Choose a member</option>${others.map(m=>`<option value="${m.user_id}">${esc(P(m.user_id).display_name)}</option>`).join('')}</select><button class="dng" data-c="gstf" style="width:100%;margin-top:8px">Transfer ownership</button></div>`:''}
 <div class="gs-card gs-dz"><h3>Leave group</h3><p class="m">You’ll stop receiving messages from this group.</p><button class="dng" data-c="gslv" style="width:100%">Leave group</button></div>
 ${o?`<div class="gs-card gs-dz"><h3>Delete group</h3><p class="m">Deletes the group and all its messages for everyone. This can’t be undone. Type <b>${esc(S.cv.name||'')}</b> to continue.</p><input id="gsdn" autocomplete="off" aria-label="Type the group name to confirm" placeholder="Group name"><button class="dng" data-c="gsdl" id="gsdb" disabled style="width:100%;margin-top:8px">Delete group</button></div>`:''}`}
document.addEventListener('input',e=>{if(e.target.id==='gsdn')$('#gsdb').disabled=e.target.value!==(S.cv.name||'')});
async function leaveUI(){const d=$('#gs');d&&d.remove();const i=$('#inf');if(i)i.remove();S.cv=null;render();loadConvs()}
/* ---- events ---- */
document.addEventListener('click',async e=>{const x=e.target.closest('[data-c]');if(!x||!x.dataset.c.startsWith('gs')&&x.dataset.c!=='gs')return;const c=x.dataset.c,k=x.dataset.k,id=x.dataset.id;
 if(c==='gs')openGS();else if(c==='gsx')closeGS();else if(c==='gsp')go(k,1);else if(c==='gsb'){if(Z.dirty&&!await ask('You have unsaved changes. Discard them?','Discard',1))return;Z.dirty=false;$('#gs').classList.remove('pg')}
 else if(c==='gsr')show(Z.page);else if(c==='gssave')saveOv();else if(c==='gsrs'){show('overview');Z.dirty=false}
 else if(c==='gsf'){MF=k;document.querySelectorAll('[data-c=gsf]').forEach(b=>b.classList.toggle('on',b.dataset.k===k));paintMem()}
 else if(c==='gsm')memSheet(id);
 else if(c==='gsrq'){if(await run(()=>R('gc_request_resolve',{req:id,approve:x.dataset.v==='1'}),x.dataset.v==='1'?'Approved.':'Denied.')){await sync();show('join')}}
 else if(c==='gsic'){const h=$('#gsih').value,u=$('#gsiu').value;if(await run(()=>R('gc_invite_create',{cid:Z.cid,p_name:$('#gsin').value.trim(),hours:h?+h:null,p_max:u?+u:null}),'Invite created.'))show('join')}
 else if(c==='gscp'){const l=location.origin+location.pathname+'?join='+id;try{await navigator.clipboard.writeText(l);toast('Link copied.')}catch(e){prompt('Copy this link',l)}}
 else if(c==='gsiv'){if(await ask('Revoke this invite link? It will stop working immediately.','Revoke',1)&&await run(()=>R('gc_invite_revoke',{invite_id:id}),'Invite revoked.'))show('join')}
 else if(c==='gsub'){if(await ask('Unban this person?','Unban')&&await run(()=>R('gc_unban',{cid:Z.cid,uid:id}),'Unbanned.')){await sync();show('mod')}}
 else if(c==='gstg'){if(await run(async()=>{const{error}=await mine({notify:x.dataset.v});if(error)throw error;await sync()},'Saved.'))show('notify')}
 else if(c==='gstf'){const u=$('#gstr').value;if(!u)return toast('Choose a member first.');const n=P(u).display_name;if(await ask('Transfer ownership to '+n+'? You will become an admin.','Transfer',1)&&await run(()=>R('group_transfer',{cid:Z.cid,uid:u}),'Ownership transferred.')){await sync();show('danger')}}
 else if(c==='gslv'){if(await ask('Leave this group?','Leave',1)&&await run(()=>R('group_leave',{cid:Z.cid})))leaveUI()}
 else if(c==='gsdl'){if(await ask('Final confirmation: permanently delete “'+S.cv.name+'” and all messages?','Delete forever',1)&&await run(()=>R('group_delete',{cid:Z.cid}),'Group deleted.'))leaveUI()}});
addEventListener('resize',ind);window.GSU={ask,run,R,dt,em,sk};
})();
</script>
<style>
.rb.sv{color:var(--tx);font-weight:800;font-family:'Bricolage Grotesque',system-ui;font-size:20px;background:color-mix(in srgb,var(--sa) 22%,var(--card))}.rb.sv.on{background:var(--sa);color:#fff}
.svh{display:flex;align-items:center;gap:8px;padding:6px 6px 8px}.svh .mh{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.svh button{width:42px;min-height:42px;padding:0;display:grid;place-items:center;border-radius:50%}
.hs{width:30px;text-align:center;font-size:24px;font-weight:700;color:var(--mute)}
.rdot{width:12px;height:12px;border-radius:50%;flex:none;display:inline-block}
.pr{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}.pr .g1{flex:1}.pr small{display:block;color:var(--mute)}

<script>
(()=>{
const {ask,run,R,dt,em,sk}=GSU;
const SV={list:[],loaded:false};
const PERMS=[[1,'Manage server','Change the server name, description and accent color.'],[2,'Manage roles','Create and edit roles, and assign them to members. You can only hand out permissions you have.'],[4,'Manage channels','Create, rename and delete channels.'],[8,'Manage members','Remove members from the server.'],[16,'Create invites','Create invite links.'],[32,'Manage invites','Revoke anyone’s invite links.'],[64,'Administrator','Has every permission. Only give this to people you fully trust.']];
const Y={sid:null,s:null,page:'overview',dirty:false,roles:[],mem:[],mr:[],t:0,role:null,bits:0};
const PGS=[['overview','Overview','sliders',0],['roles','Roles','shield',2],['members','Members','users',0],['channels','Channels','list',4],['invites','Invites','link',48],['audit','Audit log','list',1],['danger','Danger zone','alert',0]];
const own=()=>Y.s&&Y.s.owner_id===S.me.id;
const calc=()=>{if(own())return 127;const mine=new Set(Y.mr.filter(m=>m.user_id===S.me.id).map(m=>m.role_id));let p=0;Y.roles.forEach(r=>{if(r.is_default||mine.has(r.id))p|=Number(r.perms)});return p&64?127:p};
const has=b=>(Y.perm&b)!==0;
/* ---------- home: rail, list, create/join ---------- */
async function loadSv(){const{data}=await sb.from('servers').select('*').order('created_at');SV.list=data||[];if(S.srv&&!SV.list.find(x=>x.id===S.srv))S.srv=null;paintRail();if(typeof paintList==='function')paintList()}
function paintRail(){const r=document.querySelector('.rail'),add=r&&r.querySelector('[data-a=srvn]');if(!add)return;r.querySelectorAll('.sv').forEach(x=>x.remove());SV.list.forEach(s=>add.insertAdjacentHTML('beforebegin',`<button class="rb sv ${S.srv===s.id?'on':''}" data-c="svo" data-id="${s.id}" title="${esc(s.name)}" aria-label="${esc(s.name)}" style="--sa:${esc(s.accent)}">${esc([...s.name][0].toUpperCase())}</button>`));r.querySelector('.rb').classList.toggle('on',!S.srv)}
function paintSrv(){const l=$('#cl'),s=SV.list.find(x=>x.id===S.srv);if(!l||!s)return;const ch=S.convs.filter(c=>c.server_id===s.id).sort((a,b)=>(a.name||'').localeCompare(b.name||''));
 l.innerHTML=`<div class="svh"><h2 class="mh" style="font-size:24px;margin:0">${esc(s.name)}</h2><button class="g" data-c="svs" aria-label="Server settings">${I('sliders',20)}</button></div>${s.description?`<p class="m" style="margin:0 8px 10px">${esc(s.description)}</p>`:''}<small class="m" style="margin:8px 10px;display:block;font-weight:700">TEXT CHANNELS</small>${ch.map(c=>`<div class="ci ${S.cv&&S.cv.id===c.id?'on':''} ${c.un?'un':''}" data-a="open" data-id="${c.id}"><span class="hs">#</span><b>${esc(c.name)}</b>${c.un?'<i class="dot"></i>':''}</div>`).join('')||'<div class="empty">No channels yet.</div>'}`}
const wrap=(n,f)=>{const o=window[n];window[n]=function(){const r=o.apply(this,arguments);try{f()}catch(e){console.error(e)}return r}};
wrap('paintList',()=>{if(S.srv)paintSrv()});
wrap('render',()=>{if(!SV.loaded&&S.me){SV.loaded=1;loadSv()}paintRail()});
async function openSrv(id){S.srv=id;S.cv=null;if(S.tab!=='chats'){S.tab='chats';render()}else{paintRail();$('#cl').innerHTML='';paintList()}if(typeof paintThread==='function')paintThread()}
function srvCreate(){const d=document.createElement('div');d.className='cdlg';d.setAttribute('role','dialog');d.setAttribute('aria-modal','true');d.innerHTML=`<div class="cbx"><h3 style="margin:0 0 8px">Create a server</h3><input id="svn" maxlength="50" placeholder="Server name" aria-label="Server name"><button id="svc" style="width:100%;margin-top:8px">Create server</button><h3 style="margin:18px 0 8px">Join with an invite</h3><input id="svj" placeholder="Invite link or code" aria-label="Invite link or code" autocapitalize="off"><button class="g" id="svjb" style="width:100%;margin-top:8px">Join server</button><button class="g" data-r="x" style="width:100%;margin-top:14px">Cancel</button></div>`;
 d.onclick=async e=>{if(e.target===d||e.target.dataset.r)return d.remove();const b=e.target.closest('button');if(!b)return;
  if(b.id==='svc'){const n=$('#svn').value.trim();if(!n)return toast('Enter a server name.');b.disabled=true;try{const id=await R('create_server',{n});d.remove();await loadConvs();await loadSv();openSrv(id);toast('Server created.')}catch(x){b.disabled=false;toast(x.message)}}
  else if(b.id==='svjb'){const v=$('#svj').value.trim(),c=(v.match(/[?&]sj=([a-z0-9]+)/i)||[])[1]||v;if(!c)return toast('Paste an invite link or code.');joinSv(c,d)}};document.body.appendChild(d);$('#svn').focus()}
async function joinSv(c,d){try{const id=await R('server_join',{c});d&&d.remove();await loadConvs();await loadSv();openSrv(id);toast('You joined the server.')}catch(x){toast(x.message)}}
window.srvCreate=srvCreate;
{let n=0;const t=setInterval(()=>{if(++n>120)return clearInterval(t);if(!S.me)return;clearInterval(t);const c=new URLSearchParams(location.search).get('sj');if(!c)return;history.replaceState(null,'',location.pathname);ask('Join this server?','Join').then(y=>y&&joinSv(c))},500)}
/* ---------- settings shell ---------- */
async function loadY(){const[r,m,x]=await Promise.all([sb.from('server_roles').select('*').eq('server_id',Y.sid).order('created_at'),sb.from('server_members').select('*').eq('server_id',Y.sid),sb.from('member_roles').select('*').eq('server_id',Y.sid)]);Y.roles=r.data||[];Y.mem=m.data||[];Y.mr=x.data||[];Y.s=SV.list.find(z=>z.id===Y.sid)||Y.s;await prof(Y.mem.map(z=>z.user_id));Y.perm=calc()}
function openSS(){const s=SV.list.find(x=>x.id===S.srv);if(!s)return;Object.assign(Y,{sid:s.id,s,page:'overview',dirty:false,role:null});const o=document.createElement('div');o.id='gs';o.setAttribute('role','dialog');o.setAttribute('aria-modal','true');o.setAttribute('aria-label','Server settings');
 o.innerHTML=`<aside class="gs-side"><div class="gs-h"><div><b>${esc(s.name)}</b><small>Server settings</small></div><button class="g gs-x" data-c="svx" aria-label="Close settings">${I('x',20)}</button></div><nav class="gs-nav" id="gsn2"><i class="gs-ind"></i>${PGS.map(([k,l,i,b])=>`<button data-c="svp" data-k="${k}" data-b="${b}" class="${k==='danger'?'dz':''}">${I(i,20)}<span>${l}</span></button>`).join('')}</nav></aside><main class="gs-main"><header class="gs-top"><button class="g gs-bk" data-c="svb" aria-label="Back to settings list">${I('back')}</button><h2 id="gst"></h2><button class="g gs-x" data-c="svx" aria-label="Close settings">${I('x',20)}</button></header><div class="gs-body" id="gsb">${sk}</div></main>`;document.body.appendChild(o);
 loadY().then(()=>{if(!$('#gs'))return;document.querySelectorAll('#gsn2 button').forEach(b=>b.hidden=+b.dataset.b>0&&!has(+b.dataset.b));show('overview')}).catch(e=>toast(e.message))}
const ind=()=>{const b=document.querySelector('#gsn2 button.on'),i=document.querySelector('.gs-ind');if(b&&i){i.style.transform=`translateY(${b.offsetTop}px)`;i.style.height=b.offsetHeight+'px'}};
async function closeSS(){if(Y.dirty&&!await ask('You have unsaved changes. Discard them?','Discard',1))return;Y.dirty=false;const o=$('#gs');o&&o.remove()}
async function go(k,mob){if(Y.dirty&&!await ask('You have unsaved changes. Discard them?','Discard',1))return;Y.dirty=false;Y.role=null;Y.page=k;if(mob)$('#gs').classList.add('pg');show(k)}
const live=t=>t===Y.t&&$('#gs'),bd=()=>$('#gsb');
function show(k){const t=++Y.t,p=PGS.find(x=>x[0]===k);if(p[3]&&!has(p[3]))k=Y.page='overview';document.querySelectorAll('#gsn2 button').forEach(b=>b.classList.toggle('on',b.dataset.k===k));ind();$('#gst').textContent=PGS.find(x=>x[0]===k)[1];const b=bd();b.style.animation='none';b.offsetHeight;b.style.animation='';b.innerHTML=sk;b.scrollTop=0;PAGE[k](t).catch(e=>{if(live(t))b.innerHTML=em(esc(e.message||'Couldn’t load this page.')+'<br><br><button data-c="svr">Try again</button>')})}
const sw=(on,bit,dis)=>`<button class="tg" role="switch" aria-checked="${on}" data-c="svt" data-bit="${bit}" aria-label="toggle" ${dis?'disabled':''}></button>`;
/* ---------- pages ---------- */
async function ov(t){const s=Y.s,ed=has(1);if(!live(t))return;bd().innerHTML=`<p class="gs-d">The name, description and accent color of this server.</p><label for="svnm">Server name</label><input id="svnm" maxlength="50" value="${esc(s.name)}" ${ed?'':'disabled'}><label for="svds">Description</label><textarea id="svds" maxlength="300" rows="4" ${ed?'':'disabled'}>${esc(s.description||'')}</textarea><small class="m" id="svct"></small><label for="svac">Accent color</label><input id="svac" type="color" value="${esc(s.accent)}" ${ed?'':'disabled'} style="height:46px;padding:4px;width:100%">${ed?`<div class="gs-save" id="gssv"><span id="gsst">No changes</span><button class="g" data-c="svrs" disabled>Reset</button><button data-c="svsv" disabled>Save</button></div>`:'<p class="m">You need the Manage server permission to edit this.</p>'}`;if(ed)dirt()}
function dirt(){const s=Y.s,n=$('#svnm');if(!n)return;const ch=n.value.trim()!==s.name||$('#svds').value.trim()!==(s.description||'')||$('#svac').value.toLowerCase()!==s.accent.toLowerCase();Y.dirty=ch;$('#svct').textContent=$('#svds').value.length+' / 300';$('#gssv').classList.toggle('dirty',ch);$('#gsst').textContent=ch?'Unsaved changes':'No changes';document.querySelectorAll('#gssv button').forEach(b=>b.disabled=!ch)}
async function saveOv(){const n=$('#svnm').value.trim();if(!n)return toast('Server name is required.');$('#gsst').textContent='Saving…';if(await run(()=>R('server_update',{sid:Y.sid,n,d:$('#svds').value.trim(),acc:$('#svac').value}),'Saved.')){await loadSv();Y.s=SV.list.find(x=>x.id===Y.sid);Y.dirty=false;dirt();$('#gsst').textContent='Saved ✓'}else $('#gsst').textContent='Couldn’t save'}
async function rl(t){if(!live(t))return;if(Y.role)return roleEd();bd().innerHTML=`<p class="gs-d">Roles give members permissions. Everyone gets the @everyone role.</p><button data-c="svrn" style="width:100%;margin-bottom:12px">Create role</button>${Y.roles.map(r=>`<div class="gs-row"><span class="rdot" style="background:${esc(r.color)}"></span><div class="g1"><b>${esc(r.name)}</b><br><small>${Y.mr.filter(m=>m.role_id===r.id).length||(r.is_default?Y.mem.length:0)} member${(Y.mr.filter(m=>m.role_id===r.id).length||(r.is_default?Y.mem.length:0))==1?'':'s'}</small></div><button class="g" data-c="sver" data-id="${r.id}">Edit</button></div>`).join('')}`}
function roleEd(){const r=Y.role==='new'?{name:'',color:'#99aab5',perms:0}:Y.roles.find(x=>x.id===Y.role);Y.bits=Number(r.perms);const full=Y.perm===127;
 bd().innerHTML=`<button class="g" data-c="svrb">← All roles</button><label for="rnm" style="margin-top:14px">Role name</label><input id="rnm" maxlength="32" value="${esc(r.name)}" ${r.is_default?'disabled':''}><label for="rco">Color</label><input id="rco" type="color" value="${esc(r.color)}" style="height:46px;padding:4px;width:100%"><h3 style="margin:18px 0 0">Permissions</h3>${PERMS.map(([b,n,d])=>{const can=full||(Y.perm&b);return `<div class="pr" title="${esc(d)}"><div class="g1"><b>${n}</b><small>${esc(d)}${can?'':' (You don’t have this permission.)'}</small></div><button class="tg" role="switch" aria-checked="${(Y.bits&b)!==0}" aria-label="${n}" data-c="svt" data-bit="${b}" ${can?'':'disabled'}></button></div>`}).join('')}<div class="gs-save" id="gssv"><span id="gsst">${Y.role==='new'?'New role':'No changes'}</span>${Y.role!=='new'&&!r.is_default?'<button class="dng" data-c="svrd">Delete</button>':''}<button data-c="svrsv">Save role</button></div>`;Y.dirty=Y.role==='new'}
async function mbp(t){if(!live(t))return;bd().innerHTML=`<p class="gs-d">${Y.mem.length} member${Y.mem.length==1?'':'s'}</p><input id="svq" type="search" placeholder="Search members" aria-label="Search members"><div id="svml" style="margin-top:10px"></div>`;pm()}
const rolesOf=u=>Y.mr.filter(m=>m.user_id===u).map(m=>Y.roles.find(r=>r.id===m.role_id)).filter(Boolean);
function pm(){const q=(($('#svq')||{}).value||'').toLowerCase(),L=$('#svml');if(!L)return;const rows=Y.mem.filter(m=>{const u=P(m.user_id);return(u.display_name+' '+u.username).toLowerCase().includes(q)}).sort((a,b)=>(b.user_id===Y.s.owner_id)-(a.user_id===Y.s.owner_id));
 L.innerHTML=rows.length?rows.map(m=>{const u=P(m.user_id),o=m.user_id===Y.s.owner_id;return `<div class="gs-row">${av(u)}<div class="g1"><b>${esc(u.display_name||u.username)}</b> ${o?'<span class="gs-pill">Owner</span>':''}<br><small>${rolesOf(m.user_id).map(r=>`<span class="rdot" style="background:${esc(r.color)};width:9px;height:9px"></span> ${esc(r.name)}`).join(' · ')||'@'+esc(u.username)}</small></div>${!o&&(has(2)||has(8))?`<button class="g" data-c="svm" data-id="${m.user_id}">Manage</button>`:''}</div>`}).join(''):em('No members match.')}
function mSheet(id){const u=P(id),d=document.createElement('div');d.className='cdlg';d.style.zIndex=110;const rs=Y.roles.filter(r=>!r.is_default);
 d.innerHTML=`<div class="cbx"><div class="gs-row" style="background:none;padding:0">${av(u)}<div class="g1"><b>${esc(u.display_name)}</b><br><small>@${esc(u.username)}</small></div></div>${has(2)?`<h3 style="margin:14px 0 0">Roles</h3>${rs.length?rs.map(r=>`<div class="pr"><span class="rdot" style="background:${esc(r.color)}"></span><div class="g1"><b>${esc(r.name)}</b></div><button class="tg" role="switch" aria-checked="${Y.mr.some(m=>m.user_id===id&&m.role_id===r.id)}" aria-label="${esc(r.name)}" data-rid="${r.id}"></button></div>`).join(''):'<p class="m">No roles yet. Create one on the Roles page.</p>'}`:''}<div style="display:flex;flex-direction:column;gap:8px;margin-top:14px">${has(8)&&id!==S.me.id?'<button class="dng" data-x="kick">Remove from server</button>':''}<button class="g" data-x="done">Done</button></div></div>`;
 d.onclick=async e=>{const t=e.target.closest('.tg'),b=e.target.closest('[data-x]');if(t){const on=t.getAttribute('aria-checked')!=='true',rid=t.dataset.rid;if(await run(()=>R('member_role_set',{sid:Y.sid,uid:id,rid,grant_it:on}))){t.setAttribute('aria-checked',on);if(on)Y.mr.push({user_id:id,role_id:rid,server_id:Y.sid});else Y.mr=Y.mr.filter(m=>!(m.user_id===id&&m.role_id===rid));pm()}return}
  if(!b&&e.target!==d)return;if(!b||b.dataset.x==='done')return d.remove();if(await ask('Remove '+u.display_name+' from this server?','Remove',1)){if(await run(()=>R('member_kick',{sid:Y.sid,uid:id}),'Member removed.')){d.remove();await loadY();pm()}}};document.body.appendChild(d)}
async function chs(t){await loadConvs();if(!live(t))return;const ch=S.convs.filter(c=>c.server_id===Y.sid).sort((a,b)=>(a.name||'').localeCompare(b.name||''));bd().innerHTML=`<p class="gs-d">Channels are where your server talks.</p><div class="gs-card"><h3>New channel</h3><input id="svcn" maxlength="40" placeholder="channel-name" aria-label="Channel name" autocapitalize="off"><button data-c="svcc" style="width:100%;margin-top:8px">Create channel</button></div>${ch.map(c=>`<div class="gs-row"><span class="hs">#</span><div class="g1"><b>${esc(c.name)}</b></div><button class="g" data-c="svcr" data-id="${c.id}" data-n="${esc(c.name)}">Rename</button><button class="dng" data-c="svcd" data-id="${c.id}" data-n="${esc(c.name)}">Delete</button></div>`).join('')||em('No channels.')}`}
async function inv(t){const{data,error}=await sb.from('server_invites').select('*').eq('server_id',Y.sid).order('created_at',{ascending:false});if(error)throw error;await prof((data||[]).map(x=>x.created_by));if(!live(t))return;
 bd().innerHTML=`<p class="gs-d">Share a link so people can join.</p>${has(16)?`<div class="gs-card"><h3>Create invite</h3><input id="svin" maxlength="40" placeholder="Name (optional)" aria-label="Invite name"><select id="svih" aria-label="Expires"><option value="">Never expires</option><option value="1">Expires in 1 hour</option><option value="24">Expires in 24 hours</option><option value="168">Expires in 7 days</option></select><select id="sviu" aria-label="Max uses"><option value="">Unlimited uses</option><option value="1">1 use</option><option value="5">5 uses</option><option value="25">25 uses</option></select><button data-c="svic" style="width:100%;margin-top:8px">Create invite</button></div>`:''}${(data||[]).map(x=>{const dead=x.revoked||(x.expires_at&&new Date(x.expires_at)<new Date())||(x.max_uses&&x.uses>=x.max_uses);return `<div class="gs-card"><b>${esc(x.name||'Invite')}</b> ${dead?'<span class="gs-pill" style="background:var(--line);color:var(--mute)">Inactive</span>':''}<br><small class="m">${esc(x.code)} · ${x.uses}${x.max_uses?'/'+x.max_uses:''} uses${x.expires_at?' · expires '+dt(x.expires_at):''}<br>Created by ${esc(P(x.created_by).display_name)}</small>${dead?'':`<div style="display:flex;gap:8px;margin-top:10px"><button class="g" data-c="svcp" data-id="${esc(x.code)}">Copy link</button><button class="dng" data-c="sviv" data-id="${x.id}">Revoke</button></div>`}</div>`}).join('')||em('No invite links yet.')}`}
let AU=[];
async function adt(t){const{data,error}=await sb.from('server_audit').select('*').eq('server_id',Y.sid).order('created_at',{ascending:false}).limit(200);if(error)throw error;AU=data||[];await prof(AU.map(a=>a.actor));if(!live(t))return;const us=[...new Set(AU.map(a=>a.actor))],ac=[...new Set(AU.map(a=>a.action))];
 bd().innerHTML=`<p class="gs-d">Important changes to this server and who made them.</p><div class="gs-chips" style="flex-direction:column;gap:8px"><select id="svau" aria-label="Filter by person"><option value="">Everyone</option>${us.map(u=>`<option value="${u}">${esc(P(u).display_name)}</option>`).join('')}</select><select id="svaa" aria-label="Filter by action"><option value="">All actions</option>${ac.map(a=>`<option value="${esc(a)}">${esc(a.replace(/_/g,' '))}</option>`).join('')}</select><select id="svar" aria-label="Filter by date"><option value="">Any time</option><option value="1">Last 24 hours</option><option value="7">Last 7 days</option><option value="30">Last 30 days</option></select></div><div id="sval"></div>`;pa()}
const dtl=a=>{const d=a.detail||{};return esc(d.name||d.role&&(Y.roles.find(r=>r.id===d.role)||{}).name||d.role||d.code||(d.user?P(d.user).display_name:'')||'')};
function pa(){const u=$('#svau').value,a=$('#svaa').value,r=$('#svar').value,min=r?Date.now()-r*864e5:0,rows=AU.filter(x=>(!u||x.actor===u)&&(!a||x.action===a)&&new Date(x.created_at)>=min);$('#sval').innerHTML=rows.length?rows.map(x=>`<div class="gs-row"><div class="g1"><small>${dt(x.created_at)}</small><div><b>${esc(P(x.actor).display_name)}</b> ${esc(x.action.replace(/_/g,' '))} ${dtl(x)}</div></div></div>`).join(''):em('No matching activity.')}
async function dzn(t){if(!live(t))return;const o=own();bd().innerHTML=`<p class="gs-d">These actions are serious. Read before you tap.</p>${o?`<div class="gs-card gs-dz"><h3>Delete server</h3><p class="m">Deletes the server, its channels and all their messages for everyone. This can’t be undone. Type <b>${esc(Y.s.name)}</b> to continue.</p><input id="svdn" autocomplete="off" aria-label="Type the server name to confirm" placeholder="Server name"><button class="dng" id="svdb" data-c="svdl" disabled style="width:100%;margin-top:8px">Delete server</button></div>`:`<div class="gs-card gs-dz"><h3>Leave server</h3><p class="m">You’ll lose access to its channels. You can rejoin with a new invite.</p><button class="dng" data-c="svlv" style="width:100%">Leave server</button></div>`}`}
const PAGE={overview:ov,roles:rl,members:mbp,channels:chs,invites:inv,audit:adt,danger:dzn};
async function gone(){const o=$('#gs');o&&o.remove();S.srv=null;S.cv=null;await loadConvs();await loadSv();render()}
/* ---------- events ---------- */
document.addEventListener('input',e=>{const i=e.target.id;if(i==='svnm'||i==='svds'||i==='svac')dirt();else if(i==='svq')pm();else if(i==='svdn')$('#svdb').disabled=e.target.value!==Y.s.name;else if(i==='rnm'||i==='rco'){Y.dirty=true;const s=$('#gsst');if(s)s.textContent='Unsaved changes';$('#gssv').classList.add('dirty')}});
document.addEventListener('change',e=>{if(['svau','svaa','svar'].includes(e.target.id))pa()});
document.addEventListener('click',async e=>{const hb=e.target.closest('.rail .rb');if(hb&&!hb.classList.contains('sv')&&hb.dataset.a==='tab'&&S.srv){S.srv=null;setTimeout(()=>{paintRail();const l=$('#cl');if(l)l.innerHTML='';paintList()},0)}
 const x=e.target.closest('[data-c]');if(!x||!x.dataset.c.startsWith('sv'))return;const c=x.dataset.c,id=x.dataset.id;
 if(c==='svo')openSrv(id);else if(c==='svs')openSS();else if(c==='svx')closeSS();else if(c==='svp')go(x.dataset.k,1);
 else if(c==='svb'){if(Y.dirty&&!await ask('You have unsaved changes. Discard them?','Discard',1))return;Y.dirty=false;Y.role=null;$('#gs').classList.remove('pg')}
 else if(c==='svr')show(Y.page);else if(c==='svsv')saveOv();else if(c==='svrs'){Y.dirty=false;show('overview')}
 else if(c==='svrn'){Y.role='new';show('roles')}else if(c==='sver'){Y.role=id;show('roles')}
 else if(c==='svrb'){if(Y.dirty&&!await ask('You have unsaved changes. Discard them?','Discard',1))return;Y.dirty=false;Y.role=null;show('roles')}
 else if(c==='svt'&&x.closest('#gsb')){const on=x.getAttribute('aria-checked')!=='true';x.setAttribute('aria-checked',on);Y.bits=on?Y.bits|+x.dataset.bit:Y.bits&~+x.dataset.bit;Y.dirty=true;$('#gsst').textContent='Unsaved changes';$('#gssv').classList.add('dirty')}
 else if(c==='svrsv'){const n=$('#rnm').value.trim();if(!n)return toast('Role name is required.');if(await run(()=>R('role_save',{sid:Y.sid,rid:Y.role==='new'?null:Y.role,n,col:$('#rco').value,p:Y.bits}),'Role saved.')){Y.dirty=false;Y.role=null;await loadY();show('roles')}}
 else if(c==='svrd'){if(await ask('Delete this role? Members lose its permissions.','Delete',1)&&await run(()=>R('role_delete',{sid:Y.sid,rid:Y.role}),'Role deleted.')){Y.dirty=false;Y.role=null;await loadY();show('roles')}}
 else if(c==='svm')mSheet(id);
 else if(c==='svcc'){const n=$('#svcn').value.trim();if(n&&await run(()=>R('channel_create',{sid:Y.sid,n}),'Channel created.')){await loadConvs();show('channels')}}
 else if(c==='svcr'){const n=prompt('New channel name',x.dataset.n);if(n&&await run(()=>R('channel_rename',{sid:Y.sid,cid:id,n}),'Renamed.')){await loadConvs();show('channels')}}
 else if(c==='svcd'){if(await ask('Delete #'+x.dataset.n+' and all its messages?','Delete',1)&&await run(()=>R('channel_delete',{sid:Y.sid,cid:id}),'Channel deleted.')){if(S.cv&&S.cv.id===id)S.cv=null;await loadConvs();show('channels')}}
 else if(c==='svic'){const h=$('#svih').value,u=$('#sviu').value;if(await run(()=>R('sinvite_create',{sid:Y.sid,nm:$('#svin').value.trim(),hours:h?+h:null,mx:u?+u:null}),'Invite created.'))show('invites')}
 else if(c==='svcp'){const l=location.origin+location.pathname+'?sj='+id;try{await navigator.clipboard.writeText(l);toast('Link copied.')}catch(e){prompt('Copy this link',l)}}
 else if(c==='sviv'){if(await ask('Revoke this invite link?','Revoke',1)&&await run(()=>R('sinvite_revoke',{iid:id}),'Invite revoked.'))show('invites')}
 else if(c==='svlv'){if(await ask('Leave this server?','Leave',1)&&await run(()=>R('server_leave',{sid:Y.sid}),'You left the server.'))gone()}
 else if(c==='svdl'){if(await ask('Final confirmation: permanently delete “'+Y.s.name+'”, all channels and messages?','Delete forever',1)&&await run(()=>R('server_delete',{sid:Y.sid}),'Server deleted.'))gone()}});
addEventListener('resize',ind);
})();
</script>
