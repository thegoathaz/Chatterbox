<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Chatterbox</title><meta name="theme-color" content="#0f1020">
<style>
:root{--bg:#0f1020;--card:#1a1b30;--line:#2a2c47;--tx:#eef0ff;--mute:#9aa0c8;--ac:#7c5cff;--bad:#fb7185;--ok:#34d399;color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:env(safe-area-inset-top) 0 0}
button,input,textarea,select{font:inherit;color:inherit}
input,textarea,select{width:100%;background:#12132a;border:1px solid var(--line);border-radius:12px;padding:12px;margin:4px 0 10px}
button{background:var(--ac);border:0;border-radius:12px;padding:10px 14px;cursor:pointer;min-height:44px}
button.g{background:var(--card);border:1px solid var(--line)}button.d{background:transparent;color:var(--bad);border:1px solid var(--line)}
button:disabled{opacity:.5}h1,h2,h3{margin:0 0 8px}small,.m{color:var(--mute)}
.shell{display:flex;flex-direction:column;height:100%}#main{flex:1;min-height:0;overflow:auto}
.nav{display:flex;border-top:1px solid var(--line);background:var(--card);padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;background:none;border-radius:0;color:var(--mute)}.nav button.on{color:var(--tx);box-shadow:inset 0 2px var(--ac)}
.pg{padding:16px;max-width:640px;margin:0 auto}.auth{max-width:380px;margin:8vh auto;padding:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:0 0 12px}
.row{display:flex;align-items:center;gap:10px;padding:8px 0}.row>.g1{flex:1;min-width:0}.row .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row button{min-height:36px;padding:6px 10px}.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;flex:none}
.split{display:flex;height:100%}.cl{width:100%;overflow:auto;padding:12px}.th{display:none;flex-direction:column;width:100%;min-width:0}
.split.open .cl{display:none}.split.open .th{display:flex}
@media(min-width:768px){.cl{width:320px;border-right:1px solid var(--line)}.th{display:flex}.split.open .cl{display:block}.bk{display:none}}
.ci{display:flex;gap:10px;padding:10px;border-radius:12px;cursor:pointer;align-items:center}.ci:hover,.ci.on{background:var(--card)}
.hd{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
#ml{flex:1;overflow:auto;padding:12px 14px}.msg{display:flex;flex-direction:column;margin:6px 0;align-items:flex-start}.msg.me{align-items:flex-end}
.bub{background:var(--card);border-radius:14px;padding:8px 12px;max-width:85%;white-space:pre-wrap;word-break:break-word}.me .bub{background:var(--ac)}
.cmp{display:flex;gap:8px;padding:10px 14px calc(10px + env(safe-area-inset-bottom)*0);border-top:1px solid var(--line)}.cmp input{margin:0}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--ac)}.act{cursor:pointer;text-decoration:underline}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#000c;padding:10px 14px;border-radius:12px;z-index:9;max-width:90%}
.empty{text-align:center;color:var(--mute);padding:30px 10px}
</style></head><body>
<div id="app"><p class="empty">Loading…</p></div><div id="toast" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL='https://fenohwqkuudnotifkqpv.supabase.co',SUPABASE_KEY='sb_publishable_DasJhJsptFy0KzT2jqBlIw_yk-PhX53';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const S={me:null,mode:'login',tab:'chats',cv:null,msgs:[],convs:[],pf:{},fr:[],bl:[],res:[],q:'',live:false};
let tt;const toast=(m)=>{const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,4000)};
const fail=(e,m)=>{console.error(e);toast(m||(e&&e.message)||'Something went wrong. Try again.')};
const av=u=>{const n=(u&&u.username)||'?',h=[...n].reduce((a,c)=>a+c.charCodeAt(0),0)%360;return `<div class="av" style="background:hsl(${h} 55% 40%)">${esc((u&&(u.display_name||n)||'?')[0].toUpperCase())}</div>`};
const P=id=>S.pf[id]||{username:'user',display_name:'User'};
const tm=d=>{d=new Date(d);return d.toDateString()===new Date().toDateString()?d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}):d.toLocaleDateString([],{month:'short',day:'numeric'})};
async function prof(ids){ids=[...new Set(ids)].filter(i=>i&&!S.pf[i]);if(!ids.length)return;const{data}=await sb.from('profiles').select('id,username,display_name,custom_status,status,bio').in('id',ids);(data||[]).forEach(p=>S.pf[p.id]=p)}

/* ---------- auth ---------- */
sb.auth.onAuthStateChange((ev,ses)=>{
  if(ev==='PASSWORD_RECOVERY'){S.mode='newpw';return render()}
  if(ses&&(!S.me||S.me.id!==ses.user.id))setTimeout(()=>enter(ses.user),0);
  else if(!ses){S.me=null;S.live=false;render()}});
function authView(){const m=S.mode,f=(id,l,t='text',x='')=>`<label for="${id}">${l}</label><input id="${id}" type="${t}" ${x}>`;
 return `<div class="auth"><h1>💬 Chatterbox</h1><p class="m">${{login:'Log in to your account',signup:'Create your account',reset:'Reset your password',newpw:'Choose a new password'}[m]}</p>
 <form id="af">${m==='signup'?f('un','Username (3–20 letters, numbers, _)','text','autocapitalize="none" maxlength="20"')+f('dn','Display name','text','maxlength="32"'):''}
 ${m!=='newpw'?f('em','Email','email','autocomplete="email"'):''}${m!=='reset'?f('pw',m==='newpw'?'New password':'Password','password','minlength="8" autocomplete="'+(m==='login'?'current':'new')+'-password"'):''}
 <button id="ab" style="width:100%">${{login:'Log in',signup:'Sign up',reset:'Send reset email',newpw:'Save password'}[m]}</button></form>
 <p style="text-align:center">${m==='login'?'<span class="act" data-a="mode" data-id="signup">Create account</span> · <span class="act" data-a="mode" data-id="reset">Forgot password?</span>':'<span class="act" data-a="mode" data-id="login">Back to log in</span>'}</p></div>`}
document.addEventListener('submit',async e=>{e.preventDefault();const id=e.target.id,v=i=>($('#'+i)||{}).value||'';
 if(id==='af'){const b=$('#ab');b.disabled=true;try{const m=S.mode,em=v('em').trim(),pw=v('pw');
  if(m==='login'){const{error}=await sb.auth.signInWithPassword({email:em,password:pw});if(error)throw error}
  else if(m==='signup'){const un=v('un').trim().toLowerCase();if(!/^[a-z0-9_]{3,20}$/.test(un))throw Error('Username must be 3–20 letters, numbers or underscores.');
   const{data,error}=await sb.auth.signUp({email:em,password:pw,options:{data:{username:un,display_name:v('dn').trim()||un},emailRedirectTo:location.href.split('#')[0]}});if(error)throw error;
   if(!data.session){toast('Check your email to confirm your account, then log in.');S.mode='login';render()}}
  else if(m==='reset'){const{error}=await sb.auth.resetPasswordForEmail(em,{redirectTo:location.href.split('#')[0]});if(error)throw error;toast('If that email exists, a reset link is on its way.');S.mode='login';render()}
  else{const{error}=await sb.auth.updateUser({password:pw});if(error)throw error;toast('Password updated.');S.mode='login';if(S.me)render()}
 }catch(err){fail(err,/Database error/.test(err.message)?'That username or email is already taken.':null)}finally{if($('#ab'))$('#ab').disabled=false}}
 else if(id==='sf'){S.q=v('sq').trim();if(S.q.length<2)return;const{data,error}=await sb.from('profiles').select('id,username,display_name').or(`username.ilike.${S.q.replace(/[^a-z0-9_@]/gi,'')}%,user_code.eq.${S.q.toUpperCase().replace(/[^A-Z0-9]/g,'')}`).neq('id',S.me.id).limit(10);if(error)return fail(error);S.res=data||[];(data||[]).forEach(p=>S.pf[p.id]=p);paintFr()}
 else if(id==='pf'){const{error}=await sb.from('profiles').update({display_name:v('pd').trim()||S.me.username,bio:v('pb').trim().slice(0,190),custom_status:v('ps').trim().slice(0,60),status:v('pst')}).eq('id',S.me.id);if(error)return fail(error);Object.assign(S.me,{display_name:v('pd').trim()||S.me.username,bio:v('pb').trim(),custom_status:v('ps').trim(),status:v('pst')});S.pf[S.me.id]=S.me;toast('Profile saved.')}
 else if(id==='mf'){const i=$('#mi'),t=i.value.trim();if(!t||!S.cv)return;i.value='';const{error}=await sb.from('dm_messages').insert({conversation_id:S.cv.id,sender_id:S.me.id,body:t.slice(0,2000)});if(error){i.value=t;fail(error)}}
});

/* ---------- data ---------- */
async function enter(user){const{data,error}=await sb.from('profiles').select('*').eq('id',user.id).single();if(error||!data)return fail(error,'Couldn’t load your profile. Did you run the SQL schema?');
 S.me=data;S.pf[data.id]=data;render();await Promise.all([loadFr(),loadConvs()]);
 if(!S.live){S.live=true;sb.channel('cb').on('postgres_changes',{event:'*',schema:'public',table:'friendships'},()=>loadFr()).on('postgres_changes',{event:'*',schema:'public',table:'dm_messages'},onMsg).subscribe()}}
async function loadFr(){const[a,b]=await Promise.all([sb.from('friendships').select('*'),sb.from('blocks').select('*')]);if(a.error)return fail(a.error);
 S.fr=a.data||[];S.bl=b.data||[];await prof([...S.fr.flatMap(r=>[r.requester,r.addressee]),...S.bl.map(x=>x.blocked)]);paintFr();paintNav()}
async function loadConvs(){const{data:mm,error}=await sb.from('conversation_members').select('conversation_id,user_id,last_read_at');if(error)return fail(error);
 const ids=[...new Set((mm||[]).map(x=>x.conversation_id))];if(!ids.length){S.convs=[];return paintList()}
 const[c,m]=await Promise.all([sb.from('conversations').select('id,kind,name,last_message_at').in('id',ids),sb.from('dm_messages').select('conversation_id,sender_id,body,created_at').in('conversation_id',ids).order('created_at',{ascending:false}).limit(300)]);
 await prof(mm.filter(x=>x.user_id!==S.me.id).map(x=>x.user_id));
 S.convs=(c.data||[]).map(v=>{const mine=mm.find(x=>x.conversation_id===v.id&&x.user_id===S.me.id),p=mm.find(x=>x.conversation_id===v.id&&x.user_id!==S.me.id),l=(m.data||[]).find(x=>x.conversation_id===v.id);
  return{...v,peer:p&&p.user_id,last:l,un:!!(l&&l.sender_id!==S.me.id&&new Date(l.created_at)>new Date(mine.last_read_at)&&!(S.cv&&S.cv.id===v.id))}}).sort((a,b)=>new Date(b.last_message_at)-new Date(a.last_message_at));paintList();paintNav()}
let lt;const onMsg=p=>{const r=p.new&&p.new.id?p.new:p.old;
 if(p.eventType==='DELETE')S.msgs=S.msgs.filter(x=>x.id!==r.id);
 else if(S.cv&&r.conversation_id===S.cv.id){if(p.eventType==='INSERT'&&!S.msgs.some(x=>x.id===r.id))S.msgs.push(r);else if(p.eventType==='UPDATE')S.msgs=S.msgs.map(x=>x.id===r.id?r:x);markRead()}
 paintMsgs();clearTimeout(lt);lt=setTimeout(loadConvs,300)};
async function openConv(id){S.cv=S.convs.find(c=>c.id===id)||{id,peer:null};S.tab='chats';const{data,error}=await sb.from('dm_messages').select('*').eq('conversation_id',id).order('created_at',{ascending:false}).limit(100);if(error)return fail(error);
 S.msgs=(data||[]).reverse();if(S.cv.peer)await prof([S.cv.peer]);render();markRead()}
async function markRead(){if(!S.cv||!S.msgs.length)return;const t=S.msgs[S.msgs.length-1].created_at;await sb.from('conversation_members').update({last_read_at:t}).eq('conversation_id',S.cv.id).eq('user_id',S.me.id);const c=S.convs.find(x=>x.id===S.cv.id);if(c){c.un=false;paintList();paintNav()}}

/* ---------- actions ---------- */
document.addEventListener('click',async e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,id=t.dataset.id;t.disabled=true;
 try{if(a==='mode'){S.mode=id;render()}
 else if(a==='tab'){S.tab=id;if(id==='chats')S.cv=null;render()}
 else if(a==='back'){S.cv=null;render()}
 else if(a==='out'){await sb.auth.signOut()}
 else if(a==='open')await openConv(id);
 else if(a==='dm'){const{data,error}=await sb.rpc('start_dm',{other:id});if(error)throw error;await loadConvs();await openConv(data)}
 else if(a==='add'){const{error}=await sb.from('friendships').insert({requester:S.me.id,addressee:id});if(error)throw error.code==='23505'?Error('A request already exists.'):error;S.res=[];toast('Friend request sent.');await loadFr()}
 else if(a==='acc'){const{error}=await sb.from('friendships').update({status:'accepted'}).eq('id',id);if(error)throw error;await loadFr()}
 else if(a==='del'){if(t.dataset.c&&!confirm(t.dataset.c))return;const{error}=await sb.from('friendships').delete().eq('id',id);if(error)throw error;await loadFr()}
 else if(a==='blk'){if(!confirm('Block this person? This also removes them as a friend.'))return;const{error}=await sb.from('blocks').insert({blocker:S.me.id,blocked:id});if(error)throw error;await sb.from('friendships').delete().or(`and(requester.eq.${S.me.id},addressee.eq.${id}),and(requester.eq.${id},addressee.eq.${S.me.id})`);await loadFr()}
 else if(a==='unb'){const{error}=await sb.from('blocks').delete().eq('blocker',S.me.id).eq('blocked',id);if(error)throw error;await loadFr()}
 else if(a==='edit'){const m=S.msgs.find(x=>x.id===id),v=prompt('Edit message',m.body);if(v&&v.trim()&&v.trim()!==m.body){const{error}=await sb.from('dm_messages').update({body:v.trim().slice(0,2000)}).eq('id',id);if(error)throw error}}
 else if(a==='rm'){if(!confirm('Delete this message? This can’t be undone.'))return;const{error}=await sb.from('dm_messages').delete().eq('id',id);if(error)throw error}
 }catch(err){fail(err)}finally{t.disabled=false}});

/* ---------- views ---------- */
function render(){const app=$('#app');if(!S.me){app.innerHTML=authView();return}
 if(S.mode==='newpw'){app.innerHTML=authView();return}
 app.innerHTML=`<div class="shell"><main id="main"></main><nav class="nav">${[['chats','💬 Chats'],['friends','👥 Friends'],['profile','👤 Profile']].map(([k,l])=>`<button data-a="tab" data-id="${k}" class="${S.tab===k?'on':''}">${l} <span id="b-${k}"></span></button>`).join('')}</nav></div>`;
 const m=$('#main');
 if(S.tab==='chats'){m.innerHTML=`<div class="split ${S.cv?'open':''}"><section class="cl" id="cl"></section><section class="th" id="th"></section></div>`;paintList();paintThread()}
 else if(S.tab==='friends'){m.innerHTML='<div class="pg" id="fr"></div>';paintFr()}
 else m.innerHTML=`<div class="pg"><h2>Your profile</h2><p class="m">@${esc(S.me.username)} · ID ${esc(S.me.user_code)}</p><form id="pf"><label for="pd">Display name</label><input id="pd" maxlength="32" value="${esc(S.me.display_name)}"><label for="pb">About me</label><textarea id="pb" maxlength="190" rows="3">${esc(S.me.bio||'')}</textarea><label for="ps">Custom status</label><input id="ps" maxlength="60" value="${esc(S.me.custom_status||'')}"><label for="pst">Status</label><select id="pst">${['online','idle','dnd','invisible'].map(s=>`<option ${S.me.status===s?'selected':''} value="${s}">${{online:'Online',idle:'Idle',dnd:'Do Not Disturb',invisible:'Invisible'}[s]}</option>`).join('')}</select><button style="width:100%">Save profile</button></form><p></p><button class="d" data-a="out" style="width:100%">Log out</button></div>`;
 paintNav()}
function paintNav(){const u=S.convs.filter(c=>c.un).length,r=S.fr.filter(x=>x.status==='pending'&&x.addressee===S.me.id).length;const a=$('#b-chats'),b=$('#b-friends');if(a)a.innerHTML=u?'<i class="dot"></i>':'';if(b)b.innerHTML=r?`(${r})`:''}
function paintList(){const l=$('#cl');if(!l)return;l.innerHTML=`<h3>Messages</h3>`+(S.convs.length?S.convs.map(c=>{const p=P(c.peer);return `<div class="ci ${S.cv&&S.cv.id===c.id?'on':''}" data-a="open" data-id="${c.id}">${av(p)}<div class="g1" style="flex:1;min-width:0"><b>${esc(p.display_name)}</b> ${c.un?'<i class="dot"></i>':''}<div class="m t" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap"><small>${c.last?(c.last.sender_id===S.me.id?'You: ':'')+esc(c.last.body):'No messages yet'}</small></div></div><small>${c.last?tm(c.last.created_at):''}</small></div>`}).join(''):'<div class="empty">No conversations yet.<br>Add a friend, then tap Message.</div>')}
function paintThread(){const t=$('#th');if(!t)return;if(!S.cv){t.innerHTML='<div class="empty" style="margin:auto">Select a conversation</div>';return}const p=P(S.cv.peer);
 t.innerHTML=`<div class="hd"><button class="g bk" data-a="back" aria-label="Back">←</button>${av(p)}<div><b>${esc(p.display_name)}</b><br><small>@${esc(p.username)}</small></div></div><div id="ml"></div><form class="cmp" id="mf"><input id="mi" placeholder="Message ${esc(p.display_name)}" maxlength="2000" autocomplete="off" aria-label="Message"><button>Send</button></form>`;paintMsgs(true)}
function paintMsgs(force){const l=$('#ml');if(!l)return;const end=force||l.scrollHeight-l.scrollTop-l.clientHeight<90;
 l.innerHTML=S.msgs.length?S.msgs.map(m=>{const me=m.sender_id===S.me.id;return `<div class="msg ${me?'me':''}"><div class="bub">${esc(m.body)}</div><small>${tm(m.created_at)}${m.edited_at?' · edited':''}${me?` · <span class="act" data-a="edit" data-id="${m.id}">Edit</span> · <span class="act" data-a="rm" data-id="${m.id}">Delete</span>`:''}</small></div>`}).join(''):'<div class="empty">No messages yet. Say hi!</div>';if(end)l.scrollTop=l.scrollHeight}
function paintFr(){const f=$('#fr');if(!f)return;const me=S.me.id,oth=r=>r.requester===me?r.addressee:r.requester,row=(id,acts)=>{const p=P(id);return `<div class="row">${av(p)}<div class="g1"><div class="t"><b>${esc(p.display_name)}</b> <small>@${esc(p.username)}</small></div>${p.custom_status?`<small>${esc(p.custom_status)}</small>`:''}</div>${acts}</div>`};
 const inc=S.fr.filter(r=>r.status==='pending'&&r.addressee===me),out=S.fr.filter(r=>r.status==='pending'&&r.requester===me),fs=S.fr.filter(r=>r.status==='accepted');
 f.innerHTML=`<h2>Friends</h2><div class="card"><form id="sf"><label for="sq">Find people by username or ID</label><input id="sq" value="${esc(S.q)}" placeholder="username or CB12345678" autocapitalize="none"><button style="width:100%">Search</button></form>${S.res.map(p=>row(p.id,S.fr.some(r=>oth(r)===p.id)?'<small>Already connected</small>':S.bl.some(b=>b.blocked===p.id)?'':`<button data-a="add" data-id="${p.id}">Add</button>`)).join('')}</div>
 ${inc.length?`<div class="card"><h3>Requests (${inc.length})</h3>${inc.map(r=>row(r.requester,`<button data-a="acc" data-id="${r.id}">Accept</button><button class="g" data-a="del" data-id="${r.id}">Decline</button>`)).join('')}</div>`:''}
 ${out.length?`<div class="card"><h3>Sent</h3>${out.map(r=>row(r.addressee,`<button class="g" data-a="del" data-id="${r.id}">Cancel</button>`)).join('')}</div>`:''}
 <div class="card"><h3>All friends (${fs.length})</h3>${fs.length?fs.map(r=>row(oth(r),`<button data-a="dm" data-id="${oth(r)}">Message</button><button class="g" data-a="blk" data-id="${oth(r)}">Block</button><button class="d" data-a="del" data-id="${r.id}" data-c="Remove this friend?">Remove</button>`)).join(''):'<div class="empty">No friends yet. Search above to add someone.</div>'}</div>
 ${S.bl.length?`<div class="card"><h3>Blocked</h3>${S.bl.map(b=>row(b.blocked,`<button class="g" data-a="unb" data-id="${b.blocked}">Unblock</button>`)).join('')}</div>`:''}`}
</script></body></html>
