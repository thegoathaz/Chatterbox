 try{if(a==='mode'){S.mode=id;S.note='';render()}
 else if(a==='tab'){S.tab=id;if(id==='chats')S.cv=null;render()}
 else if(a==='back'){S.cv=null;render()}
 else if(a==='out'){await sb.auth.signOut()}
 else if(a==='open')await openConv(id);
 else if(a==='dm'){const{data,error}=await sb.rpc('start_dm',{other:id});if(error)throw error;await loadConvs();await openConv(data)}
 else if(a==='add'){const{error}=await sb.from('friendships').insert({requester:S.me.id,addressee:id});if(error)throw error.code==='23505'?Error('A request already exists.'):error;S.res=[];toast('Friend request sent.');await loadFr()}
 else if(a==='acc'){const{error}=await sb.from('friendships').update({status:'accepted'}).eq('id',id);if(error)throw error;await loadFr()}
 else if(a==='del'){if(t.dataset.c&&!confirm(t.dataset.c))return;const{error}=await sb.from('friendships').delete().eq('id',id);if(error)throw error;await loadFr()}
 else if(a==='blk'){if(!confirm('Block this person? This also removes them as a friend.'))return;const{error}=await sb.from('blocks').insert({blocker:S.me.id,blocked:id});if(error)throw error;await sb.from('friendships').delete().or(`and(requester.eq.${S.me.id},addressee.eq.${id}),and(requester.eq.${id},addressee.eq.${S.me.id})`);await loadFr()}
 else if(a==='unb'){const{error}=await sb.from('blocks').delete().eq('blocker',S.me.id).eq('blocked',id);if(error)throw error;await loadFr()}
 else if(a==='edit'){const m=S.msgs.find(x=>x.id===id),v=prompt('Edit message',m.body);if(v&&v.trim()&&v.trim()!==m.body){const{error}=await sb.from('dm_messages').update({body:v.trim().slice(0,2000)}).eq('id',id);if(error)throw error}}
 else if(a==='rm'){if(!confirm('Delete this message? This can’t be undone.'))return;const{error}=await sb.from('dm_messages').delete().eq('id',id);if(error)throw error}
 }catch(err){fail(err)}finally{t.disabled=false}});

function paintNav(){const u=S.convs.filter(c=>c.un).length,r=S.fr.filter(x=>x.status==='pending'&&x.addressee===S.me.id).length;document.title=(ST.n.badge&&u?'('+u+') ':'')+'Chatterbox';try{if(navigator.setAppBadge)ST.n.badge&&u?navigator.setAppBadge(u):navigator.clearAppBadge()}catch(e){}const a=$('#b-chats'),b=$('#b-friends');if(a)a.innerHTML=ST.n.badge&&u?'<i class="dot"></i>':'';if(b)b.innerHTML=r?`(${r})`:''}
function paintList(){const l=$('#cl');if(!l)return;l.innerHTML=`<h3>Messages</h3>`+(S.convs.length?S.convs.map(c=>{const p=P(c.peer);return `<div class="ci ${S.cv&&S.cv.id===c.id?'on':''}" data-a="open" data-id="${c.id}">${av(p)}<div class="g1" style="flex:1;min-width:0"><b>${esc(p.display_name)}</b> ${c.un?'<i class="dot"></i>':''}<div class="m t" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap"><small>${c.last?(c.last.sender_id===S.me.id?'You: ':'')+(ST.lp?esc(c.last.body):'Message'):'No messages yet'}</small></div></div><small>${c.last?tm(c.last.created_at):''}</small></div>`}).join(''):'<div class="empty">No conversations yet.<br>Add a friend, then tap Message.</div>')}
function paintThread(){const t=$('#th');if(!t)return;if(!S.cv){t.innerHTML='<div class="empty" style="margin:auto">Select a conversation</div>';return}const p=P(S.cv.peer);
 t.innerHTML=`<div class="hd"><button class="g bk" data-a="back" aria-label="Back">←</button><span class="pvl" data-pv="${S.cv.peer}" role="button" tabindex="0" aria-label="View profile" style="display:flex;gap:10px;align-items:center">${av(p)}<div><b>${esc(p.display_name)}</b><br><small>@${esc(p.username)}</small></div></span></div><div id="ml" role="log" ${ST.sr?'aria-live="polite"':''}></div><form class="cmp" id="mf">${ST.enter?`<input id="mi" placeholder="Message ${esc(p.display_name)}" maxlength="2000" autocomplete="off" aria-label="Message">`:`<textarea id="mi" rows="2" placeholder="Message ${esc(p.display_name)}" maxlength="2000" aria-label="Message"></textarea>`}<button>Send</button></form>`;paintMsgs(true)}
function paintMsgs(force){const l=$('#ml');if(!l)return;const end=force||l.scrollHeight-l.scrollTop-l.clientHeight<90;
 l.innerHTML=S.msgs.length?S.msgs.map(m=>{const me=m.sender_id===S.me.id;return `<div class="msg ${me?'me':''}"><div class="bub">${esc(m.body)}</div><small>${[ST.ts?tm(m.created_at):'',m.edited_at&&ST.edited?'edited':'',...(me?[`<span class="act" data-a="edit" data-id="${m.id}">Edit</span>`,`<span class="act" data-a="rm" data-id="${m.id}">Delete</span>`]:[])].filter(Boolean).join(' · ')}</small></div>`}).join(''):'<div class="empty">No messages yet. Say hi!</div>';if(end)l.scrollTop=l.scrollHeight}
function paintFr(){const f=$('#fr');if(!f)return;const me=S.me.id,oth=r=>r.requester===me?r.addressee:r.requester,row=(id,acts)=>{const p=P(id);return `<div class="row"><span class="pvl" data-pv="${id}" role="button" tabindex="0" aria-label="View profile">${av(p)}</span><div class="g1 pvl" data-pv="${id}" role="button" tabindex="0"><div class="t"><b>${esc(p.display_name)}</b> <small>@${esc(p.username)}</small></div>${p.custom_status?`<small>${esc(p.custom_status)}</small>`:''}</div>${acts}</div>`};
 const inc=S.fr.filter(r=>r.status==='pending'&&r.addressee===me),out=S.fr.filter(r=>r.status==='pending'&&r.requester===me),fs=S.fr.filter(r=>r.status==='accepted');
 f.innerHTML=`<h2>Friends</h2><div class="card"><form id="sf"><label for="sq">Find people by username or ID</label><input id="sq" value="${esc(S.q)}" placeholder="username or CB12345678" autocapitalize="none"><button style="width:100%">Search</button></form>${S.res.map(p=>row(p.id,S.fr.some(r=>oth(r)===p.id)?'<small>Already connected</small>':S.bl.some(b=>b.blocked===p.id)?'':`<button data-a="add" data-id="${p.id}">Add</button>`)).join('')}</div>
 ${inc.length?`<div class="card"><h3>Requests (${inc.length})</h3>${inc.map(r=>row(r.requester,`<button data-a="acc" data-id="${r.id}">Accept</button><button class="g" data-a="del" data-id="${r.id}">Decline</button>`)).join('')}</div>`:''}
 ${out.length?`<div class="card"><h3>Sent</h3>${out.map(r=>row(r.addressee,`<button class="g" data-a="del" data-id="${r.id}">Cancel</button>`)).join('')}</div>`:''}
 <div class="card"><h3>All friends (${fs.length})</h3>${fs.length?fs.map(r=>row(oth(r),`<button data-a="dm" data-id="${oth(r)}">Message</button><button class="g" data-a="blk" data-id="${oth(r)}">Block</button><button class="d" data-a="del" data-id="${r.id}" data-c="Remove this friend?">Remove</button>`)).join(''):'<div class="empty">No friends yet. Search above to add someone.</div>'}</div>
 ${S.bl.length?`<div class="card"><h3>Blocked</h3>${S.bl.map(b=>row(b.blocked,`<button class="g" data-a="unb" data-id="${b.blocked}">Unblock</button>`)).join('')}</div>`:''}`}
</script></body></html>
