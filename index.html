const delCard=()=>cdx('Delete account',`<p class="m">Permanently deletes your account and sign-in. This can’t be undone.</p><label for="a-del">Type your username <b>${esc(S.me.username)}</b> to continue</label><input id="a-del" autocomplete="off" autocapitalize="none" value="${esc(S.delTxt||'')}"><div class="m" id="r-del" role="alert" style="min-height:18px;font-size:14px"></div><button class="d" id="b-del" data-sact="del" style="width:100%" ${S.delTxt===S.me.username?'':'disabled'}>${S.delArm?'Tap again to permanently delete':'Delete my account'}</button>`,'style="border-color:var(--bad)"');

 +cdx('Email',frm('s-em',inp('a-em','New email','','type="email" autocomplete="email"'),'Change email'))
 +cdx('Password',frm('s-pw',inp('a-pw','New password','','type="password" minlength="8" autocomplete="new-password"')+inp('a-pw2','Confirm new password','','type="password" minlength="8" autocomplete="new-password"'),'Change password'))
 +cdx('Connected accounts',ids.length?ids.map(i=>srow(esc(i[0].toUpperCase()+i.slice(1)),'Sign-in method','<small>Connected</small>')).join(''):'<p class="m">None.</p>')+delCard()},
notifications:()=>cdx('',tg('n.on','Notifications','Show alerts for new messages while Chatterbox is in the background.')+tg('n.dm','Message notifications','Notify for new direct messages.')+tg('n.sound','Notification sounds','Play a short sound.')+tg('n.preview','Message previews','Show the message text. When off, alerts say “New message”.')+tg('n.badge','Unread badge','Show the unread count in the tab title and app icon.')+`<p class="m" style="font-size:13px">Alerts are silenced while your status is Do Not Disturb. ${'Notification' in window?'Browser permission: '+Notification.permission+'.':'This browser doesn’t support notifications.'}</p><button class="g" data-sact="ntest" style="width:100%">Send test notification</button>`),
appearance:()=>cdx('',sl('theme','Theme',[['system','System'],['light','Light'],['dark','Dark']])+srow('Accent color','',`<div class="sws">${['#7c5cff','#3b82f6','#10b981','#f59e0b','#ef4444','#ec4899'].map(c=>`<button class="swt ${ST.accent===c?'on':''}" data-sc="${c}" style="background:${c}" aria-label="Accent ${c}"></button>`).join('')}</div>`)+sl('fs','Font size',[[85,'Small'],[100,'Default'],[115,'Large'],[130,'Extra large']])+sl('spacing','Message spacing',[['compact','Compact'],['cozy','Cozy'],['roomy','Roomy']])+sl('bg','Chat background',[['default','Default'],['mid','Subtle'],['tint','Accent tint']])+tg('rm','Reduce animations','Turns off motion effects.')),
chat:()=>cdx('',tg('enter','Press Enter to send','When off, Enter adds a new line and Ctrl/⌘ + Enter sends.')+tg('ts','Show timestamps')+tg('edited','Show “edited” labels')+tg('lp','Message previews in your chat list')),
privacy:()=>cdx('Online status',srow('Status','Shown to your friends.',`<select data-ps aria-label="Status" style="width:auto;margin:0">${[['online','Online'],['idle','Idle'],['dnd','Do Not Disturb'],['invisible','Invisible']].map(([v,l])=>`<option value="${v}" ${S.me.status===v?'selected':''}>${l}</option>`).join('')}</select>`))+cdx(`Blocked users (${S.bl.length})`,S.bl.length?S.bl.map(b=>{const p=P(b.blocked);return `<div class="row">${av(p)}<div class="g1"><b>${esc(p.display_name)}</b> <small>@${esc(p.username)}</small></div><button class="g" data-a="unb" data-id="${b.blocked}">Unblock</button></div>`}).join(''):'<p class="m">You haven’t blocked anyone.</p>')+'<p class="m" style="font-size:13px">Controls for who can message you or send friend requests aren’t available yet.</p>',
devices:()=>cdx('This device',srow(esc(dev()),'Current session','<small>Active now</small>')+srow('Signed in','',`<small>${esc(fdt((S.user||{}).last_sign_in_at))}</small>`))+cdx('Sessions','<p class="m" style="font-size:14px">Other devices can’t be listed one by one, but you can log them all out. Use this if you lost a device or think someone else has access.</p><button class="g" data-sact="others" style="width:100%;margin-bottom:8px">Log out all other devices</button><button class="d" data-sact="global" style="width:100%">Log out everywhere</button><div class="m" id="r-dev" role="status" style="min-height:18px;font-size:14px"></div>')+cdx('Security',srow('Password','Change it under Account.','<button class="g" data-ss="account">Open</button>')+srow('Two-factor authentication','Not available yet.','<small>—</small>')),
language:()=>cdx('',srow('App language','Only English is available right now.','<small>English</small>')+sl('clock','Clock',[['auto','Automatic'],['12','12-hour'],['24','24-hour']])+sl('date','Date format',[['auto','Automatic'],['mdy','Oct 19 (month first)'],['dmy','19 Oct (day first)']])+`<p class="m" style="font-size:13px">Preview: ${esc(tm(Date.now()))} · ${esc(tm(Date.now()-864e5*3))}</p>`),
access:()=>cdx('',tg('lt','Larger text','Makes all text 15% bigger.')+tg('hc','High contrast','Stronger borders and brighter secondary text.')+tg('rm','Reduced motion','Turns off motion effects.')+tg('sr','Screen reader announcements','Announces new messages as they arrive.')+'<p class="m" style="font-size:13px">Chatterbox also follows your device’s reduced-motion setting.</p>'),
storage:()=>cdx('Storage','<div id="r-est" class="m">Calculating…</div><button class="g" data-sact="cache" style="width:100%;margin:10px 0 8px">Clear cached data</button><button class="d" data-sact="reset" style="width:100%">Reset all settings</button>'),
about:()=>cdx('Chatterbox',srow('Version','','<small>Web app · build 2026-10-19</small>')+srow('Signed in as','',`<small>@${esc(S.me.username)}</small>`))+'<p class="m" style="font-size:13px">Terms of Service, Privacy Policy, Community Guidelines and Help links haven’t been set up yet.</p>'};
function paintSettings(){$('#main').innerHTML='<div class="split"><section class="cl" id="scl"></section><section class="th" id="sth"></section></div>';paintSet()}
function paintSet(){if(S.tab!=='settings')return;const l=$('#scl'),t=$('#sth');if(!l||!t)return;const cur=S.set||(innerWidth>=768?'account':null),sc=SECS.find(x=>x[0]===cur),old=$('#sscroll'),y=old?old.scrollTop:0;
 $('.split').classList.toggle('open',!!cur);
 l.innerHTML='<h3>Settings</h3>'+SECS.map(([k,i,n])=>`<div class="ci ${cur===k?'on':''}" role="button" tabindex="0" data-ss="${k}"><span style="font-size:20px">${i}</span><b>${n}</b></div>`).join('')+'<p class="m" style="font-size:12px;padding:8px">Saved on this device and to your account.</p>';
 t.innerHTML=sc?`<div class="hd"><button class="g bk" data-ss="" aria-label="Back to settings">←</button><b>${sc[1]} ${sc[2]}</b></div><div id="sscroll" style="flex:1;overflow:auto"><div class="pg" style="max-width:640px">${R[cur]()}</div></div>`:'';
 const nw=$('#sscroll');if(nw)nw.scrollTop=y;if(cur==='storage')estimate()}
async function estimate(){const e=$('#r-est');if(!e)return;try{const s=await navigator.storage.estimate(),f=n=>n>1e6?(n/1e6).toFixed(1)+' MB':Math.round(n/1e3)+' KB';e.textContent='Using '+f(s.usage||0)+' of '+f(s.quota||0)+' on this device.'}catch(x){e.textContent='Storage details aren’t available in this browser.'}}
function beep(){try{const c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.frequency.value=880;g.gain.value=.08;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.12)}catch(e){}}
async function notifyMsg(p){if(p.eventType!=='INSERT'||!p.new||!S.me||p.new.sender_id===S.me.id)return;const r=p.new;
 if(S.cv&&S.cv.id===r.conversation_id&&!document.hidden&&S.tab==='chats')return;if(!ST.n.on||!ST.n.dm||S.me.status==='dnd')return;
 if(ST.n.sound)beep();if(!('Notification' in window)||Notification.permission!=='granted')return;await prof([r.sender_id]);
 try{new Notification(ST.n.preview?P(r.sender_id).display_name:'Chatterbox',{body:ST.n.preview?String(r.body).slice(0,120):'New message',tag:'cb-'+r.conversation_id})}catch(e){}}
document.addEventListener('click',async e=>{
 const n=e.target.closest('[data-ss]');if(n){S.set=n.dataset.ss||null;S.delTxt='';S.delArm=false;paintSet();return}
 const c=e.target.closest('[data-sc]');if(c){ST.accent=c.dataset.sc;saveST();paintSet();return}
 const b=e.target.closest('[data-sact]');if(!b)return;const a=b.dataset.sact;
 try{if(a==='ntest'){if(!('Notification' in window))return toast('This browser doesn’t support notifications.');if(Notification.permission!=='granted'){const r=await Notification.requestPermission();if(r!=='granted')return toast('Notifications are blocked. Allow them in your browser settings.')}new Notification('Chatterbox',{body:'Notifications are working.'});if(ST.n.sound)beep()}
 else if(a==='others'){const{error}=await sb.auth.signOut({scope:'others'});setR('r-dev',error?authMsg(error):'Done. Every other device has been logged out.',!error)}
 else if(a==='global'){if(!confirm('Log out everywhere, including this device?'))return;await sb.auth.signOut({scope:'global'})}
 else if(a==='cache'){try{for(const k of await caches.keys())await caches.delete(k)}catch(x){}const me=S.pf[S.me.id];S.pf={};S.pf[S.me.id]=me;toast('Cached data cleared.');estimate()}
 else if(a==='reset'){ST=mg(DEF,{});saveST();paintSet();toast('Settings reset.')}
 else if(a==='del'){if(S.delTxt!==S.me.username)return;if(!S.delArm){S.delArm=true;paintSet();return}b.disabled=true;const{error}=await sb.rpc('delete_my_account');if(error){S.delArm=false;paintSet();return setR('r-del',/delete_my_account|PGRST202|schema cache/.test(error.message+(error.code||''))?'Account deletion isn’t set up yet. The app owner needs to add the delete_my_account function in Supabase.':authMsg(error),false)}await sb.auth.signOut()}
 }catch(err){fail(err,authMsg(err))}});
document.addEventListener('change',async e=>{const t=e.target;if(!t.dataset)return;
 if(t.dataset.ps!==undefined){const{error}=await sb.from('profiles').update({status:t.value}).eq('id',S.me.id);if(error){fail(error);return paintSet()}S.me.status=t.value;S.pf[S.me.id]=S.me;toast('Status updated.');return}
 const p=t.dataset.st;if(!p)return;const cur=gp(p),v=typeof cur==='boolean'?t.checked:typeof cur==='number'?Number(t.value):t.value;
 if(p==='n.on'&&v){if(!('Notification' in window)){t.checked=false;return toast('This browser doesn’t support notifications.')}if(Notification.permission!=='granted'){const r=await Notification.requestPermission();if(r!=='granted'){t.checked=false;return toast('Notifications are blocked. Allow them in your browser settings.')}}}
 sp(p,v);saveST();paintSet();paintNav()});
document.addEventListener('submit',async e=>{const id=e.target.id;if(!id||!id.startsWith('s-'))return;e.preventDefault();const v=i=>($('#'+i)||{}).value||'',r=(m,ok)=>setR('r-'+id,m,ok),btn=e.target.querySelector('button');if(btn.disabled)return;btn.disabled=true;
 try{if(id==='s-dn'){const dn=v('a-dn').trim();if(!dn)return r('Enter a display name.');const{error}=await sb.from('profiles').update({display_name:dn}).eq('id',S.me.id);if(error)throw error;S.me.display_name=dn;S.pf[S.me.id]=S.me;r('Saved.',1)}
 else if(id==='s-un'){const un=v('a-un').trim().toLowerCase();if(!/^[a-z0-9_]{3,20}$/.test(un))return r('Username must be 3–20 letters, numbers or underscores.');if(un===S.me.username)return r('That’s already your username.');const{error}=await sb.from('profiles').update({username:un}).eq('id',S.me.id);if(error)throw error.code==='23505'?Error('That username is taken.'):error;S.me.username=un;S.pf[S.me.id]=S.me;r('Username changed.',1)}
 else if(id==='s-em'){const em=v('a-em').trim();if(!/^\S+@\S+\.\S+$/.test(em))return r('Enter a valid email address.');const{error}=await sb.auth.updateUser({email:em});if(error)throw error;r('Confirmation sent. Open the link in the email to finish changing it.',1)}
 else if(id==='s-pw'){const a=v('a-pw'),b=v('a-pw2');if(a.length<8)return r('Use at least 8 characters.');if(a!==b)return r('The passwords don’t match.');const{error}=await sb.auth.updateUser({password:a});if(error)throw error;e.target.reset();r('Password updated.',1)}
 }catch(err){console.error(err);r(authMsg(err),0)}finally{btn.disabled=false}});
document.addEventListener('input',e=>{if(e.target.id==='a-del'){S.delTxt=e.target.value;S.delArm=false;const b=$('#b-del');if(b){b.disabled=S.delTxt!==S.me.username;b.textContent='Delete my account'}}});
document.addEventListener('keydown',e=>{if(e.target.id==='mi'&&e.target.tagName==='TEXTAREA'&&e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();e.target.form.requestSubmit()}else if(e.key==='Enter'&&e.target.matches&&e.target.matches('[data-ss][role=button]'))e.target.click()});

/* ---------- views ---------- */
function render(){const app=$('#app');if(!S.me){app.innerHTML=authView();return}
 if(S.mode==='newpw'){app.innerHTML=authView();return}
 app.innerHTML=`<div class="shell"><main id="main"></main><nav class="nav">${[['chats','💬 Chats'],['friends','👥 Friends'],['profile','👤 Profile'],['settings','⚙️ Settings']].map(([k,l])=>`<button data-a="tab" data-id="${k}" class="${S.tab===k?'on':''}">${l} <span id="b-${k}"></span></button>`).join('')}</nav></div>`;
 const m=$('#main');
 if(S.tab==='chats'){m.innerHTML=`<div class="split ${S.cv?'open':''}"><section class="cl" id="cl"></section><section class="th" id="th"></section></div>`;paintList();paintThread()}
 else if(S.tab==='friends'){m.innerHTML='<div class="pg" id="fr"></div>';paintFr()}
 else if(S.tab==='settings'){paintSettings()}
 else m.innerHTML=`<div class="pg"><h2>Your profile</h2><p class="m">@${esc(S.me.username)} · ID ${esc(S.me.user_code)}</p><form id="pf"><label for="pd">Display name</label><input id="pd" maxlength="32" value="${esc(S.me.display_name)}"><label for="pb">About me</label><textarea id="pb" maxlength="190" rows="3">${esc(S.me.bio||'')}</textarea><label for="ps">Custom status</label><input id="ps" maxlength="60" value="${esc(S.me.custom_status||'')}"><label for="pst">Status</label><select id="pst">${['online','idle','dnd','invisible'].map(s=>`<option ${S.me.status===s?'selected':''} value="${s}">${{online:'Online',idle:'Idle',dnd:'Do Not Disturb',invisible:'Invisible'}[s]}</option>`).join('')}</select><button style="width:100%">Save profile</button></form><p></p><button class="d" data-a="out" style="width:100%">Log out</button></div>`;
 paintNav()}
function paintNav(){const u=S.convs.filter(c=>c.un).length,r=S.fr.filter(x=>x.status==='pending'&&x.addressee===S.me.id).length;document.title=(ST.n.badge&&u?'('+u+') ':'')+'Chatterbox';try{if(navigator.setAppBadge)ST.n.badge&&u?navigator.setAppBadge(u):navigator.clearAppBadge()}catch(e){}const a=$('#b-chats'),b=$('#b-friends');if(a)a.innerHTML=ST.n.badge&&u?'<i class="dot"></i>':'';if(b)b.innerHTML=r?`(${r})`:''}
function paintList(){const l=$('#cl');if(!l)return;l.innerHTML=`<h3>Messages</h3>`+(S.convs.length?S.convs.map(c=>{const p=P(c.peer);return `<div class="ci ${S.cv&&S.cv.id===c.id?'on':''}" data-a="open" data-id="${c.id}">${av(p)}<div class="g1" style="flex:1;min-width:0"><b>${esc(p.display_name)}</b> ${c.un?'<i class="dot"></i>':''}<div class="m t" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap"><small>${c.last?(c.last.sender_id===S.me.id?'You: ':'')+(ST.lp?esc(c.last.body):'Message'):'No messages yet'}</small></div></div><small>${c.last?tm(c.last.created_at):''}</small></div>`}).join(''):'<div class="empty">No conversations yet.<br>Add a friend, then tap Message.</div>')}
function paintThread(){const t=$('#th');if(!t)return;if(!S.cv){t.innerHTML='<div class="empty" style="margin:auto">Select a conversation</div>';return}const p=P(S.cv.peer);
 t.innerHTML=`<div class="hd"><button class="g bk" data-a="back" aria-label="Back">←</button>${av(p)}<div><b>${esc(p.display_name)}</b><br><small>@${esc(p.username)}</small></div></div><div id="ml" role="log" ${ST.sr?'aria-live="polite"':''}></div><form class="cmp" id="mf">${ST.enter?`<input id="mi" placeholder="Message ${esc(p.display_name)}" maxlength="2000" autocomplete="off" aria-label="Message">`:`<textarea id="mi" rows="2" placeholder="Message ${esc(p.display_name)}" maxlength="2000" aria-label="Message"></textarea>`}<button>Send</button></form>`;paintMsgs(true)}
function paintMsgs(force){const l=$('#ml');if(!l)return;const end=force||l.scrollHeight-l.scrollTop-l.clientHeight<90;
 l.innerHTML=S.msgs.length?S.msgs.map(m=>{const me=m.sender_id===S.me.id;return `<div class="msg ${me?'me':''}"><div class="bub">${esc(m.body)}</div><small>${[ST.ts?tm(m.created_at):'',m.edited_at&&ST.edited?'edited':'',...(me?[`<span class="act" data-a="edit" data-id="${m.id}">Edit</span>`,`<span class="act" data-a="rm" data-id="${m.id}">Delete</span>`]:[])].filter(Boolean).join(' · ')}</small></div>`}).join(''):'<div class="empty">No messages yet. Say hi!</div>';if(end)l.scrollTop=l.scrollHeight}
function paintFr(){const f=$('#fr');if(!f)return;const me=S.me.id,oth=r=>r.requester===me?r.addressee:r.requester,row=(id,acts)=>{const p=P(id);return `<div class="row">${av(p)}<div class="g1"><div class="t"><b>${esc(p.display_name)}</b> <small>@${esc(p.username)}</small></div>${p.custom_status?`<small>${esc(p.custom_status)}</small>`:''}</div>${acts}</div>`};
 const inc=S.fr.filter(r=>r.status==='pending'&&r.addressee===me),out=S.fr.filter(r=>r.status==='pending'&&r.requester===me),fs=S.fr.filter(r=>r.status==='accepted');
 f.innerHTML=`<h2>Friends</h2><div class="card"><form id="sf"><label for="sq">Find people by username or ID</label><input id="sq" value="${esc(S.q)}" placeholder="username or CB12345678" autocapitalize="none"><button style="width:100%">Search</button></form>${S.res.map(p=>row(p.id,S.fr.some(r=>oth(r)===p.id)?'<small>Already connected</small>':S.bl.some(b=>b.blocked===p.id)?'':`<button data-a="add" data-id="${p.id}">Add</button>`)).join('')}</div>
 ${inc.length?`<div class="card"><h3>Requests (${inc.length})</h3>${inc.map(r=>row(r.requester,`<button data-a="acc" data-id="${r.id}">Accept</button><button class="g" data-a="del" data-id="${r.id}">Decline</button>`)).join('')}</div>`:''}
 ${out.length?`<div class="card"><h3>Sent</h3>${out.map(r=>row(r.addressee,`<button class="g" data-a="del" data-id="${r.id}">Cancel</button>`)).join('')}</div>`:''}
 <div class="card"><h3>All friends (${fs.length})</h3>${fs.length?fs.map(r=>row(oth(r),`<button data-a="dm" data-id="${oth(r)}">Message</button><button class="g" data-a="blk" data-id="${oth(r)}">Block</button><button class="d" data-a="del" data-id="${r.id}" data-c="Remove this friend?">Remove</button>`)).join(''):'<div class="empty">No friends yet. Search above to add someone.</div>'}</div>
 ${S.bl.length?`<div class="card"><h3>Blocked</h3>${S.bl.map(b=>row(b.blocked,`<button class="g" data-a="unb" data-id="${b.blocked}">Unblock</button>`)).join('')}</div>`:''}`}
</script></body></html>
